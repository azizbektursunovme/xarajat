<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
/* ===================== TOKENS ===================== */
:root{
  --serif:Newsreader,"LM Roman 12","Latin Modern Roman","GFS Baskerville",Georgia,serif;
  --disp:Newsreader,"LM Roman 17","Latin Modern Roman","GFS Baskerville",Georgia,serif;
  --mono:"JetBrains Mono","Latin Modern Mono","LM Mono 10",ui-monospace,Menlo,Consolas,monospace;
  --monocaps:"JetBrains Mono","Latin Modern Mono Caps","Latin Modern Mono",ui-monospace,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F1ECE1;--paper2:#FBF8F1;--ink:#1C1A16;--ink2:#47423A;--muted:#5F584C;--rule:#CBC2AF;--rule2:#DDD5C4;
  --sig:#2436C9;--sig-ink:#FBF8F1;--sig-soft:rgba(36,54,201,.09);--dng:#B8301C;--dng-soft:rgba(184,48,28,.08);--pos:#1F6B3A;--dim:rgba(28,26,22,.45);
  --exp:#B3261E;--inc:#1B7A3B;--inc-soft:rgba(27,122,59,.1);
  --shadow:0 1px 0 rgba(60,50,30,.08),0 8px 24px -12px rgba(60,50,30,.25);
  --sat:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  --sab:max(env(safe-area-inset-bottom,0px),calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)));
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#121110;--paper2:#1C1A17;--ink:#EDE7DA;--ink2:#C9C2B3;--muted:#AAA393;--rule:#3B3731;--rule2:#2C2925;
  --sig:#8E9CFF;--sig-ink:#121110;--sig-soft:rgba(142,156,255,.12);--dng:#FF7C67;--dng-soft:rgba(255,124,103,.1);--pos:#7FD39A;--dim:rgba(0,0,0,.62);
  --exp:#FF7F6E;--inc:#6FD291;--inc-soft:rgba(111,210,145,.12);
  --shadow:0 0 0 1px #2A2723;
  color-scheme:dark;
}
/* ===================== BASE ===================== */
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:inherit}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
#app{padding-bottom:calc(104px + var(--sab))}
#app.noTab{padding-bottom:calc(30px + var(--sab))}
.su{font-family:var(--sans);word-spacing:0;font-size:.82em;opacity:.8;letter-spacing:0}
.serif{font-family:var(--serif);font-weight:400}
.disp{font-family:var(--disp);font-weight:400}
.it{font-style:italic}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;word-spacing:-.32em;letter-spacing:-.01em}
.wrap{padding:0 22px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;color:var(--ink2);border-radius:50%;flex:none}
.ibtn:active{background:var(--sig-soft)}
.pos{color:var(--pos)}
.dng{color:var(--dng)}
/* money direction: spent = red with −, added = green with +, credit still owed = blue */
.exp{color:var(--exp)}
.inc{color:var(--inc)}
.owed{color:var(--sig)}
/* avatar (home masthead + settings profile) */
.avatar{width:44px;height:44px;display:grid;place-items:center;flex:none}
.avatar>span{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--serif);font-size:19px;line-height:1;color:var(--ink);background:var(--paper2)}
.avatar.pro>span{border-color:var(--sig);color:var(--sig);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--sig)}
.avatar.big{width:64px;height:64px}
.avatar.big>span{width:58px;height:58px;font-size:30px}
.profile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:4px 0}
.profile .pn{font-family:var(--serif);font-size:27px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lock .lockic{display:grid;place-items:center;width:52px;height:52px;margin:4px auto 0;border:1.5px solid var(--ink);border-radius:50%;color:var(--ink)}
.prochip{display:inline-block;font-family:var(--monocaps);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sig);border:1.3px solid var(--sig);border-radius:4px;padding:1px 5px 0;margin-left:6px;vertical-align:2px}
.agdone{margin-top:18px;padding:18px;border:1.3px dashed var(--rule);text-align:center}
.aglink{margin-top:8px;font-family:var(--mono);font-size:13.5px;line-height:1.45;color:var(--sig);word-break:break-all;user-select:all;-webkit-user-select:all}
.logo{width:58px;height:58px;display:block}
/* premium plans + gift receipt */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.plan{position:relative;border:1.5px solid var(--rule);border-radius:8px;padding:16px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-height:124px;background:var(--paper2)}
.plan.on{border-color:var(--sig);box-shadow:inset 0 0 0 1.5px var(--sig)}
.plan .pm{font-family:var(--serif);font-size:21px;line-height:1.1}
.plan .ps{font-size:14px;margin-top:2px}
.plan .ps b{font-size:20px}
.plan .pp{font-size:12.5px;color:var(--muted)}
.plan .pdisc{font-family:var(--mono);font-size:12.5px;color:var(--inc);font-weight:700}
.plan .pbest{position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--paper2);font-size:9.5px;margin:0;white-space:nowrap}
.receipt.gift{margin:0 4px;padding-right:58px;overflow:visible}
.receipt.gift .ribbon{position:absolute;top:0;bottom:0;right:24px;width:13px;background:var(--sig)}
.receipt.gift .bow{position:absolute;top:-16px;right:4px;width:54px;height:34px}
.gnote{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.35;text-align:center;margin:18px 0 0;color:var(--ink);overflow-wrap:anywhere}
.gfrom{text-align:right;font-family:var(--serif);font-style:italic;color:var(--ink2);margin-top:6px;font-size:16px}
.gstamp{position:absolute;left:18px;bottom:22px;transform:rotate(-8deg);font-size:12px;margin:0;background:var(--paper2)}
.sharebox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule)}
.langsw{display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;flex:none}
.langsw button{min-width:40px;min-height:40px;padding:0 9px;font-size:13px;font-weight:600;color:var(--ink2)}
.langsw button.on{background:var(--ink);color:var(--paper2)}
.logo svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 14px rgba(36,54,201,.25))}
.acct .mono.dng{color:var(--exp)}
.muted{color:var(--muted)}
/* ===================== MASTHEAD ===================== */
.mast{display:flex;align-items:center;padding:calc(10px + var(--sat)) 10px 0 10px;min-height:54px}
.mast h1{font-size:30px;line-height:1;letter-spacing:-.01em;flex:1;display:flex;align-items:baseline;gap:8px;padding-left:2px;min-width:0}
.mast h1 .y{font-size:18px;color:var(--muted)}
.mast .ptitle{font-size:36px;line-height:1;flex:1;padding-left:12px}
.mast .dtitle{font-size:24px;line-height:1.1;flex:1;padding-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mast .ibtn{color:var(--ink)}
.rule2{border:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);height:4px;margin:10px 22px 0}
.dateline{display:flex;justify-content:space-between;gap:12px;padding:8px 22px 0;font-size:14px;color:var(--muted)}
.lbl{font-size:15px;color:var(--muted)}
h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.05;letter-spacing:-.01em}
.sec{margin-top:44px}
.sec>.sechead:first-child{border-top:2px solid var(--ink);padding-top:14px}
.sechead>.lbl,.sechead>.mono{font-size:15px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hair{border-top:1px solid var(--rule)}
.dash{border-top:1px dashed var(--rule)}
.hero-n{font-size:84px;line-height:.92;letter-spacing:-.035em;display:flex;align-items:baseline;gap:10px;margin-top:10px;white-space:nowrap;overflow:hidden}
.hero-n .u,.big2 .u{font-family:var(--serif);font-size:26px;letter-spacing:0;color:var(--muted);font-style:italic}
.big2{font-size:64px;line-height:.98;letter-spacing:-.03em;display:flex;align-items:baseline;gap:10px;margin-top:8px;white-space:nowrap;overflow:hidden}
.big2 .u{font-size:24px}
.split{display:grid;grid-template-columns:1fr auto;margin-top:22px;border-top:1px solid var(--rule)}
.split.even{grid-template-columns:1fr 1fr}
.split>div{padding-top:12px;min-width:0}
.split>div+div{border-left:1px solid var(--rule);padding-left:18px}
.split .lbl{font-size:14.5px;line-height:1.3}
.legend{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:10px;margin-top:16px}
.lg{display:flex;align-items:center;gap:7px;font-size:15px;min-width:0}
.lg>span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg .dots,.lead{flex:1;border-bottom:1.5px dotted var(--rule);transform:translateY(-4px);min-width:4px}
.lg .mono{font-size:15px;color:var(--ink2)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0}
.row .mono{font-size:17px}
.acct{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 18px;margin-top:12px}
.acct>button{font-size:14px;color:var(--muted);text-align:left;min-height:44px;min-width:44px}
.hit{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:flex-end}
a.row{min-height:44px;align-items:center}
.acct .mono{display:block;font-size:17px;color:var(--ink);margin-top:2px}
.note{display:flex;align-items:center;gap:14px;padding:14px 0;min-height:72px;width:100%}
.note .t{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .s{font-size:14px;color:var(--muted);margin-top:2px}
.note .amt{font-size:17px;text-align:right}
.stamp{display:inline-block;border:1.6px solid currentColor;border-radius:4px;padding:2px 7px 1px;font-family:var(--monocaps);font-size:11.5px;letter-spacing:.06em;word-spacing:-.2em;white-space:nowrap;margin-top:6px;text-transform:uppercase;line-height:1.35}
.stamp.d{color:var(--dng);transform:rotate(-4deg)}
.stamp.s{color:var(--sig)}
.stamp.p{color:var(--pos);transform:rotate(-3deg)}
.stamp.m{color:var(--muted)}
.syncnote{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--muted);padding:26px 22px 0;text-align:center}
/* ===================== RECEIPT ===================== */
.receipt{position:relative;margin:16px 6px 0;background:var(--paper2);box-shadow:var(--shadow);padding:22px 20px 26px}
.edge{position:absolute;left:0;width:100%;height:10px;color:var(--paper2);pointer-events:none}
.edge.top{top:-9px}.edge.bot{bottom:-9px;transform:scaleY(-1)}
.rc-head{text-align:center}
.rc-head .serif{font-size:24px;font-style:italic}
.rc-head .mono{font-size:13px;color:var(--muted);margin-top:2px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px;width:100%}
.tx .t{font-size:16.5px;font-weight:500}
.tx .s{font-size:13.5px;color:var(--muted)}
.tx .a{margin-left:auto;font-size:17px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 4px;font-size:15px}
.more{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--sig);font-weight:600;font-size:15px;min-height:44px;margin-top:6px;width:100%}
.strip{margin:30px 6px 0;padding:18px 18px 20px}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dh .serif{font-size:23px;font-style:italic}
.li{display:flex;gap:10px;padding:11px 0;min-height:54px;align-items:flex-start;width:100%}
.li .mk{width:14px;padding-top:4px;flex:none;color:var(--muted)}
.li .bd{flex:1;min-width:0}
.ln{display:flex;align-items:baseline;gap:6px;min-width:0}
.ln .t{font-size:16.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.ln .a{font-size:16.5px;flex:none}
.li .s{font-size:13.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.virt .t{font-weight:400;color:var(--ink2)}
.totrow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0 0;font-size:15px}
/* ===================== TAB BAR ===================== */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;z-index:30}
.tabbar nav{border-top:1px solid var(--ink);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:0 6px calc(8px + var(--sab));background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:var(--muted);padding-top:10px;min-height:58px;position:relative}
.tab.on{color:var(--ink);font-weight:600}
.tab.on:before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--sig)}
.fab{width:62px;height:62px;border-radius:50%;background:var(--sig);color:var(--sig-ink);display:grid;place-items:center;margin:-20px auto 0;box-shadow:0 0 0 6px var(--bg)}
.fab:active{transform:scale(.96)}
/* ===================== TABS / TYPES ===================== */
.types{display:flex;align-items:flex-end;gap:24px;border-bottom:1px solid var(--rule);margin-top:14px}
.types>a,.types>button{padding:10px 0 12px;font-size:16px;color:var(--muted);position:relative;min-height:44px;min-width:44px;white-space:nowrap;flex:none}
.types.scroll-x{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-right:-22px;padding-right:22px}
.types.scroll-x::-webkit-scrollbar{display:none}
.types.scroll-x>.on:after{bottom:0}
.types>.on{color:var(--ink);font-weight:600}
.types>.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--sig)}
.types .mono{font-size:12px}
.sumline{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14.5px;gap:8px}
.mnav{display:flex;align-items:center;margin-left:-12px;min-width:0}
.mnav .ibtn{width:40px}
/* ===================== CALENDAR ===================== */
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--muted);text-align:center;padding:14px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.cal>*{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);height:60px;padding:5px 5px 4px 6px;display:flex;flex-direction:column;justify-content:space-between;position:relative;min-width:0;text-align:left}
.cal .d{font-size:13px}
.cal .v{font-size:11px;text-align:right;word-spacing:-.4em;overflow:hidden}
.cal .v small{font-size:8.5px;margin-left:2px;letter-spacing:-.02em}
.cal .fut .d{color:var(--muted)}
.l1{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.l2{background:color-mix(in srgb,var(--ink) 26%,transparent)}
.l3{background:color-mix(in srgb,var(--ink) 72%,transparent);color:var(--bg)}
.l4{background:var(--ink);color:var(--bg)}
.cal .sel{box-shadow:inset 0 0 0 3px var(--sig)}
.cal .today:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--sig)}
.cal .today .d{font-weight:700}
.scale{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:12px;font-size:12px;color:var(--muted)}
.scale i{width:18px;height:14px;border:1px solid var(--rule);display:block}
/* ===================== DEBTS ===================== */
.daftar{position:relative;margin-top:0}
.daftar:before{content:"";position:absolute;top:0;bottom:0;left:42px;width:1px;background:var(--sig);opacity:.5}
.dsub{padding:16px 0 6px 56px;font-family:var(--serif);font-style:italic;font-size:20px;border-bottom:1px solid var(--rule)}
.dsub .mono{font-family:var(--mono);font-style:normal;font-size:13.5px;color:var(--muted);margin-left:6px}
.drow{display:flex;border-bottom:1px solid var(--rule);min-height:80px;padding:13px 0 12px;width:100%}
.drow .ini{width:42px;font-size:13px;color:var(--muted);padding-top:2px;overflow:hidden;flex:none}
.drow .bd{flex:1;padding-left:14px;min-width:0}
.drow .ln .t{font-size:17px}
.drow .ln .a{font-size:17px}
.drow .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-top:4px}
.drow .meta>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{min-height:54px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;width:100%;padding:0 14px;text-align:center}
.btn.pri{background:var(--sig);color:var(--sig-ink)}
.btn.ghost{border:1.5px solid var(--ink);color:var(--ink)}
.btn.dngb{border:1.5px solid var(--dng);color:var(--dng)}
.btn.dngfill{background:var(--dng);color:var(--paper2)}
.btn.sm{min-height:44px;font-size:15px}
.btn:disabled,.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.btn:active{filter:brightness(.95)}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.linkrow{display:flex;align-items:center;gap:10px;min-height:52px;color:var(--ink2);font-size:15.5px;border-bottom:1px dashed var(--rule);width:100%}
.led{width:100%;border-collapse:collapse;font-size:13px}
.led th{font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:0 3px 8px;border-bottom:1px solid var(--ink);white-space:nowrap}
.led td{padding:10px 3px;border-bottom:1px dashed var(--rule);vertical-align:top;white-space:nowrap}
.led tbody tr{cursor:pointer}
.led .r{text-align:right}
.led td.mono{font-size:13px}
.led tfoot td{border-bottom:0;border-top:3px double var(--ink);padding-top:10px;font-weight:700}
.led .sub{display:block;font-size:12.5px;color:var(--muted);font-family:var(--sans);word-spacing:0;overflow:hidden;text-overflow:ellipsis}
.led td.wrapc{white-space:normal}
.handnote{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.5;color:var(--ink2);padding:14px 0 0;background:repeating-linear-gradient(to bottom,transparent 0 26px,var(--rule2) 26px 27px);background-position:0 14px;white-space:pre-wrap;word-break:break-word}
/* ===================== LOANS ===================== */
.contract{border:1px solid var(--ink);padding:3px;margin-top:18px;background:var(--paper2);display:block;width:100%}

  },
  async deleteAll() {
    if (this.mode !== 'sync') return;
    for (const id in this.W) { const w = this.W[id]; clearTimeout(w.timer); clearTimeout(w.retryT); }
    this.W = {};
    try { const keys = (await CS.keys()).filter(k => k.startsWith('d_')); const metas = keys.filter(k => k.endsWith('_meta')); await CS.remove(metas); await CS.remove(keys.filter(k => !k.endsWith('_meta'))); } catch (e) { }
    this.remote = {}; this.meta = {}; this.saveKnown(); this.keyCount = 0;
  },
};

   ===================================================================== */
const accById = id => S.settings.accounts.find(a => a.id === id);
const catById = id => S.settings.cats.find(c => c.id === id);
const accName = id => (accById(id) || {}).name || '—';
const DEF_CAT_NAMES = new Set(defaultCats().map(c => c.name));
/** category name; the built-in ones follow the app language */
const catName = id => { const n = (catById(id) || {}).name || 'Boshqa'; return DEF_CAT_NAMES.has(n) ? T(n) : n; };
const personById = id => S.debts.people.find(p => p.id === id);
const loanById = id => S.loans.loans.find(l => l.id === id);
const rateOr = r => r || S.settings.usdRate || 0;

function findTx(id) {
  for (const ym in S.months) { const t = S.months[ym].tx.find(x => x.id === id); if (t) return t; }
  return null;
}
/** insert (dedupe by id) */
function txInsert(tx) {
  const ym = ymOf(tx.date);
  const m = S.months[ym] || (S.months[ym] = { tx: [], _u: 0 });
  const i = m.tx.findIndex(x => x.id === tx.id);
  if (i >= 0) m.tx[i] = tx; else m.tx.push(tx);
  return docIdForMonth(ym);
}
function txRemove(id) {
  for (const ym in S.months) {
    const m = S.months[ym], i = m.tx.findIndex(x => x.id === id);
    if (i >= 0) { const [t] = m.tx.splice(i, 1); return { tx: t, doc: docIdForMonth(ym) }; }
  }
  return null;
}
function txNormalize(tx) {
  tx.amount = tx.currency === 'USD' ? Math.round(tx.amount * 100) / 100 : Math.round(tx.amount);
  if (tx.currency === 'USD') tx.rate = rateOr(tx.rate); else delete tx.rate;
  tx.uzs = calc.toUZS(tx.amount, tx.currency, tx.rate);
  return tx;
}
function saveTx(tx, oldId) {
  const docs = [];
  if (oldId) { const r = txRemove(oldId); if (r) docs.push(r.doc); }
  docs.push(txInsert(txNormalize(tx)));
  commit(docs);
}
function deleteTx(id) {
  const r = txRemove(id);
  if (!r) return null;
  commit([r.doc]);
  return r.tx;
}

/* recurring — materialise due occurrences idempotently (deterministic ids) */
function materializeRecurring() {
  if (!S.settings || !S.settings.onboarded) return;
  const t = today(), docs = [];
  let settingsChanged = false;
  for (const rec of S.settings.recurring) {
    if (rec.active === false) continue;
    const dates = calc.recurringDates(rec, t);
    for (const d of dates) {
      const id = calc.recTxId(rec.id, d);
      if (!findTx(id)) {
        docs.push(txInsert(txNormalize({
          id, type: rec.type, amount: rec.amount, currency: rec.currency, rate: rec.rate, catId: rec.catId || null,
          accId: rec.accId, toAccId: rec.toAccId || null, date: d, time: '', note: rec.note || '', recId: rec.id, createdAt: Date.now(),
        })));
      }
    }
    if (dates.length) { rec.lastDone = dates[dates.length - 1]; settingsChanged = true; }
  }
  if (settingsChanged) docs.push('settings');
  if (docs.length) commit(docs);
}

/* debts */
function ensurePerson(name, phone) {
  const n = normName(name);
  let p = S.debts.people.find(x => normName(x.name) === n);
  if (!p) { p = { id: newId('p'), name: name.trim().replace(/\s+/g, ' '), phone: phone || '' }; S.debts.people.push(p); }
  else if (phone && !p.phone) p.phone = phone;
  return p;
}
function addDebt(o) {
  const p = ensurePerson(o.person, o.phone);
  const d = {
    id: newId('d'), pid: p.id, dir: o.dir, amount: o.amount, currency: o.currency || 'UZS', rate: o.currency === 'USD' ? rateOr(o.rate) : undefined,
    date: o.date, due: o.due || null, note: o.note || '', accId: o.affectsBalance ? o.accId : null, affectsBalance: !!o.affectsBalance && !!o.accId, createdAt: Date.now(),
  };
  S.debts.debts.push(d);
  commit(['debts']);
  return d;
}
function updateDebt(id, patch) {
  const d = S.debts.debts.find(x => x.id === id); if (!d) return;
  Object.assign(d, patch);
  if (!d.affectsBalance) d.accId = null;
  commit(['debts']);
}
/** record repayment; if amount > remaining and allowOver, excess becomes a reverse debt */
function payDebt(debtId, amount, date, accId, note, allowOver) {
  const d = S.debts.debts.find(x => x.id === debtId); if (!d) return null;
  const rem = calc.debtRemaining(d, S.debts.payments);
  const applied = Math.min(amount, rem), excess = amount - applied;
  const out = { payments: [], debts: [] };
  if (applied > 0) {
    const p = { id: newId('q'), debtId, amount: applied, date, accId: d.affectsBalance ? accId : null, note: note || '', kind: 'pay', createdAt: Date.now() };
    S.debts.payments.push(p); out.payments.push(p.id);
  }
  if (excess > 0 && allowOver) {
    const rev = {
      id: newId('d'), pid: d.pid, dir: d.dir === 'given' ? 'taken' : 'given', amount: excess, currency: d.currency, rate: d.rate,
      date, due: null, note: 'Ortiqcha toʻlov', accId: d.affectsBalance ? accId : null, affectsBalance: d.affectsBalance && !!accId, createdAt: Date.now(),
    };
    S.debts.debts.push(rev); out.debts.push(rev.id);
  }
  commit(['debts']);
  return out;
}
function forgiveDebt(debtId, date) {
  const d = S.debts.debts.find(x => x.id === debtId); if (!d) return null;
  const rem = calc.debtRemaining(d, S.debts.payments); if (rem <= 0) return null;
  const p = { id: newId('q'), debtId, amount: rem, date, accId: null, note: '', kind: 'forgive', createdAt: Date.now() };
  S.debts.payments.push(p);
  commit(['debts']);
  return p;
}
function snapshotDebts() { return clone(S.debts); }
function restoreDebts(snap) { const u = S.debts._u; S.debts = snap; S.debts._u = u; commit(['debts']); }

/* loans */
function addLoan(loan, prepaid) {
  S.loans.loans.push(loan);
  if (loan.type !== 'card') {
    const rows = calc.buildSchedule(loan);
    for (let i = 0; i < Math.min(prepaid || 0, rows.length); i++) { rows[i].paid = rows[i].total; rows[i].paidDate = rows[i].due; rows[i].pre = true; }
    S.loans.payments.push(...rows);
  }
  commit(['loans']);
}
function loanTx(loan, amount, accId, date, rowId) {
  const acc = accById(accId);
  const tx = txNormalize({
    id: newId('t'), type: 'exp', amount, currency: 'UZS', catId: 'credit', accId, date, time: date === today() ? nowHM() : '',
    note: loan.name, loanId: loan.id, loanPayId: rowId, createdAt: Date.now(),
  });
  void acc;
  return tx;
}
function payLoanRow(loanId, rowId, accId, date) {
  const loan = loanById(loanId), row = S.loans.payments.find(r => r.id === rowId);
  if (!loan || !row || row.paid) return;
  const tx = loanTx(loan, row.total, accId, date, row.id);
  row.paid = row.total; row.paidDate = date; row.txId = tx.id; row.accId = accId;
  const docs = ['loans', txInsert(tx)];
  updateLoanStatus(loan);
  commit(docs);
}
function undoLoanRow(rowId) {
  const row = S.loans.payments.find(r => r.id === rowId); if (!row || !row.paid) return;
  const docs = ['loans'];
  if (row.txId) { const r = txRemove(row.txId); if (r) docs.push(r.doc); }
  row.paid = 0; row.paidDate = null; row.txId = null; row.pre = false;
  const loan = loanById(row.loanId); if (loan) updateLoanStatus(loan);
  commit(docs);
}
function earlyRepay(loanId, X, mode, date, accId) {
  const loan = loanById(loanId); if (!loan) return null;
  const res = calc.earlyRepay(loan, S.loans.payments, X, mode, date);
  if (!res) return null;
  const tx = loanTx(loan, res.extra.total, accId, date, res.extra.id);
  res.extra.txId = tx.id; res.extra.accId = accId;
  S.loans.payments = S.loans.payments.filter(r => !res.removed.includes(r.id)).concat([res.extra], res.newRows);
  updateLoanStatus(loan);
  commit(['loans', txInsert(tx)]);
  return res;
}
function undoEarly(extraId) {
  const ex = S.loans.payments.find(r => r.id === extraId); if (!ex || !ex.extra) return;
  const loan = loanById(ex.loanId);
  // remove regenerated unpaid rows of this loan that come after, restore previous rows
  S.loans.payments = S.loans.payments.filter(r => r.id !== extraId && !(r.loanId === ex.loanId && !r.extra && !r.paid));
  if (Array.isArray(ex.prev)) S.loans.payments.push(...ex.prev);
  const docs = ['loans'];
  if (ex.txId) { const r = txRemove(ex.txId); if (r) docs.push(r.doc); }
  if (loan) updateLoanStatus(loan);
  commit(docs);
}
function canUndoEarly(ex) {
  // allowed only if no scheduled row of the loan was paid after it
  return !S.loans.payments.some(r => r.loanId === ex.loanId && r.paid && !r.pre && r.id !== ex.id && (r.paidDate > ex.paidDate || (r.extra && r.paidDate === ex.paidDate && r.id > ex.id)));
}
function updateLoanStatus(loan) {
  if (loan.type === 'card') return;
  const s = calc.loanSummary(loan, S.loans.payments);
  loan.status = s.closed ? 'closed' : 'active';
}
function cardPay(loanId, amount, accId, date) {
  const loan = loanById(loanId); if (!loan) return null;
  amount = Math.min(Math.round(amount || 0), Math.max(0, loan.used || 0)); // never pay more than is owed
  if (!(amount > 0)) return null;
  const row = { id: newId('c'), loanId, extra: true, card: true, due: date, principal: amount, interest: 0, total: amount, paid: amount, applied: amount, paidDate: date };
  const tx = loanTx(loan, amount, accId, date, row.id);
  row.txId = tx.id; row.accId = accId;
  loan.used = Math.max(0, (loan.used || 0) - amount);
  S.loans.payments.push(row);
  commit(['loans', txInsert(tx)]);
  return row;
}
function undoCardPay(rowId) {
  const row = S.loans.payments.find(r => r.id === rowId); if (!row) return;
  const loan = loanById(row.loanId);
  if (loan) loan.used = (loan.used || 0) + (row.applied != null ? row.applied : row.paid);
  S.loans.payments = S.loans.payments.filter(r => r.id !== rowId);
  const docs = ['loans'];
  if (row.txId) { const r = txRemove(row.txId); if (r) docs.push(r.doc); }
  commit(docs);
}
/** Edit a loan. Card: fields only. Bank / nasiya: rebuild the schedule from the new terms, keep every real
 *  payment (amount, date, account, expense link) on its row, and mark rows as paid-before-the-app up to
 *  paidWanted. Returns { snap } (for undo) or { error }. */
function editLoan(loanId, patch, paidWanted) {
  const loan = loanById(loanId); if (!loan) return { error: 'Kredit topilmadi' };
  const snap = clone(S.loans);
  if (loan.type === 'card') { Object.assign(loan, patch); commit(['loans']); return { snap }; }
  const rows = S.loans.payments.filter(r => r.loanId === loanId);
  const sched = rows.filter(r => !r.extra).sort(calc.rowSort);
  const KEYS = ['scheme', 'principal', 'total', 'rate', 'term', 'issued', 'payDay'];
  const termsChanged = KEYS.some(k => patch[k] !== undefined && patch[k] !== loan[k])
    || (patch.adj !== undefined && JSON.stringify(patch.adj || null) !== JSON.stringify(loan.adj || null));
  const paidNow = sched.filter(r => r.paid).length;
  if (!termsChanged && paidWanted === paidNow) { loan.name = patch.name; loan.lender = patch.lender; commit(['loans']); return { snap }; }
  if (rows.some(r => r.extra)) return { error: 'Muddatidan oldin toʻlov qilingan kreditda shartlarni oʻzgartirib boʻlmaydi. Avval jadvaldan oʻsha toʻlovni bekor qiling.' };
  const realIdx = sched.map((r, i) => (r.paid && !r.pre ? i : -1)).filter(i => i >= 0);
  const next = Object.assign({}, loan, patch);
  next.firstDue = addMonths(next.issued, 1, next.payDay);
  const fresh = calc.buildSchedule(next);
  if (realIdx.length && realIdx[realIdx.length - 1] >= fresh.length) return { error: `Ilovada ${realIdx.length} ta toʻlov yozilgan — muddat bundan qisqa boʻlolmaydi.` };
  if (paidWanted < realIdx.length) return { error: `Ilovada ${realIdx.length} ta toʻlov yozilgan. Kamroq qilish uchun ularni jadvaldan bekor qiling.` };
  let paid = 0;
  fresh.forEach((nr, i) => {
    const or = sched[i];
    if (or) nr.id = or.id; // keeps expense links (tx.loanPayId) valid
    if (or && or.paid && !or.pre) { nr.paid = or.paid; nr.paidDate = or.paidDate; nr.txId = or.txId; nr.accId = or.accId; paid++; }
  });
  const want = Math.min(paidWanted, fresh.length);
  for (const nr of fresh) { if (paid >= want) break; if (!nr.paid) { nr.paid = nr.total; nr.paidDate = nr.due; nr.pre = true; paid++; } }
  Object.assign(loan, patch, { firstDue: next.firstDue });
  S.loans.payments = S.loans.payments.filter(r => r.loanId !== loanId).concat(fresh);
  updateLoanStatus(loan);
  commit(['loans']);
  return { snap };
}
function deleteLoan(loanId) {
  const snap = clone(S.loans);
  S.loans.loans = S.loans.loans.filter(l => l.id !== loanId);
  S.loans.payments = S.loans.payments.filter(r => r.loanId !== loanId);
  // keep expense records, just unlink them
  const docs = ['loans'];
  for (const ym in S.months) {
    let ch = false;
    for (const t of S.months[ym].tx) if (t.loanId === loanId) { t.loanId = null; t.loanPayId = null; ch = true; }
    if (ch) docs.push(docIdForMonth(ym));
  }
  commit(docs);
  return snap;
}

/* transaction presentation */
function txTitle(t) {

function txSub(t, withDate) {
  const parts = [];

  else { if (t.note) parts.push(catName(t.catId)); parts.push(accName(t.accId)); }

    ${inc ? html`<div class="totrow" style="padding-top:4px"><span>Kirim</span><span class="mono inc" style="font-size:16px">+${fmt(inc)}</span></div>` : ''}
    ${edge('bot')}</div>`;
}

/* budget ruler (home) */
function budgetRuler(segs, budget, spent) {
  const W = contentW(), H = 26, Y = 22, M = Math.max(budget, spent) || 1;
  let x = 0, g = '', qoldiAbove = '';
  for (const s of segs) {
    const w = s.amount / M * W; if (w <= 0) continue;
    g += `<rect x="${x.toFixed(1)}" y="${Y}" width="${Math.max(w - 1.5, .8).toFixed(1)}" height="${H}" fill="${s.fill}"/>`;
    x += w;
  }
  const sx = Math.min(x, W);
  if (budget > 0 && spent < budget) {
    const rw = W - sx;
    g += `<rect x="${(sx + .75).toFixed(1)}" y="${Y + .75}" width="${Math.max(rw - 1.5, 0).toFixed(1)}" height="${H - 1.5}" style="fill:var(--sig-soft);stroke:var(--sig)" stroke-width="1.5"/>`;
    const txt = T(`${compact(budget - spent)} qoldi`);
    if (rw > txt.length * 7.8 + 10) g += `<text class="svt" x="${(sx + rw / 2).toFixed(1)}" y="${Y + 17.5}" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--sig)">${esc(txt)}</text>`;
    else if (rw > compact(budget - spent).length * 7.8 + 10) g += `<text class="svt" x="${(sx + rw / 2).toFixed(1)}" y="${Y + 17.5}" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--sig)">${esc(compact(budget - spent))}</text>`;
    else if (sx > W * 0.5) qoldiAbove = txt;
  }
  if (budget > 0 && spent > budget) {
    const bx = budget / M * W;
    g += `<path d="M${bx.toFixed(1)} ${Y - 4}V${Y + H + 3}" style="stroke:var(--dng)" stroke-width="2" stroke-dasharray="3 2"/>`;
  }
  const lbl = T(`${compact(spent)} sarflandi`);
  const left = sx > W * 0.5;
  if (qoldiAbove && sx + 8 + qoldiAbove.length * 7.6 <= W) g += `<text class="svt" x="${(sx + 6).toFixed(1)}" y="${Y - 9}" text-anchor="start" font-size="12.5" font-weight="700" style="fill:var(--sig)">${esc(qoldiAbove)}</text>`;
  g += `<path d="M${Math.max(sx, .75).toFixed(1)} ${Y - 7}V${Y + H + 3}" style="stroke:var(--ink)" stroke-width="1.5"/>`;
  g += `<text class="svt" x="${(left ? sx - 4 : sx + 4).toFixed(1)}" y="${Y - 9}" text-anchor="${left ? 'end' : 'start'}" font-size="12.5" style="fill:var(--ink)">${esc(lbl)}</text>`;
  const mln = M >= 1e6;
  for (let i = 0; i <= 18; i++) {
    const tx = Math.min(Math.max(i / 18 * W, .75), W - .75);
    g += `<path d="M${tx.toFixed(1)} ${Y + H + 4}v${i % 2 === 0 ? 8 : 4}" style="stroke:var(--ink2)" stroke-width="1"/>`;
    if (i % 6 === 0) {
      const v = M * i / 18;
      const s = i === 0 ? '0' : mln ? String(Math.round(v / 1e5) / 10).replace('.', ',') : String(Math.round(v / 1e3));
      g += `<text class="svt" x="${(i / 18 * W).toFixed(1)}" y="${Y + H + 25}" text-anchor="${i === 0 ? 'start' : i === 18 ? 'end' : 'middle'}" font-size="12" style="fill:var(--muted)">${s}${i === 18 ? unitTxt(mln ? 'mln' : 'ming') : ''}</text>`;
    }
  }
  return raw(`<svg width="${W}" height="${Y + H + 30}" viewBox="0 0 ${W} ${Y + H + 30}" style="margin-top:16px;overflow:visible" role="img" aria-label="${esc(T('Byudjet'))}: ${esc(lbl)}" translate="no">${g}</svg>`);
}
function progressRuler(frac, labelIn, labelOut) {
  const W = contentW(), H = 22, Y = 4, x = Math.max(0, Math.min(1, frac)) * W;
  let t = '';
  for (let i = 0; i <= 20; i++) { const tx = Math.min(Math.max(i / 20 * W, .75), W - .75); t += `<path d="M${tx.toFixed(1)} ${Y + H + 4}v${i % 10 === 0 ? 9 : i % 5 === 0 ? 6 : 3}" style="stroke:var(--ink2)"/>`; }
  let g = '';
  if (x > 1) g += `<rect x="0" y="${Y}" width="${Math.max(x - 1, 0).toFixed(1)}" height="${H}" style="fill:var(--ink)"/>`;
  if (W - x > 1) g += `<rect x="${(x + .75).toFixed(1)}" y="${Y + .75}" width="${Math.max(W - x - 1.5, 0).toFixed(1)}" height="${H - 1.5}" style="fill:var(--sig-soft);stroke:var(--sig)" stroke-width="1.5"/>`;
  if (W - x > labelOut.length * 7.6 + 8) g += `<text class="svt" x="${((x + W) / 2).toFixed(1)}" y="${Y + 15.5}" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--sig)">${esc(labelOut)}</text>`;
  if (x > labelIn.length * 7.6 + 8) g += `<text class="svt" x="${(x / 2).toFixed(1)}" y="${Y + 15.5}" text-anchor="middle" font-size="12.5" style="fill:var(--bg)">${esc(labelIn)}</text>`;
  return raw(`<svg width="${W}" height="${Y + H + 14}" style="margin-top:18px;display:block">${g}${t}</svg>`);
}
function payRuler(n, paid, W, nextLate) {
  if (n > 60) return contBar(paid / n, W);
  const gap = n > 36 ? 1 : 2, w = (W - gap * (n - 1)) / n; let r = '';
  for (let i = 0; i < n; i++) {
    const x = i * (w + gap);
    if (i < paid) r += `<rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="16" style="fill:var(--ink)"/>`;
    else if (i === paid) r += `<rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="16" style="fill:var(${nextLate ? '--dng' : '--sig'})"/>`;
    else r += `<rect x="${(x + .5).toFixed(2)}" y=".5" width="${Math.max(w - 1, .5).toFixed(2)}" height="15" fill="none" style="stroke:var(--rule)" stroke-width="1"/>`;
  }
  return raw(`<svg width="${W}" height="16" style="margin-top:12px">${r}</svg>`);
}
function contBar(frac, W) {
  let t = '';
  for (let i = 0; i <= 10; i++) { const x = Math.min(Math.max(i / 10 * W, .5), W - .5); t += `<path d="M${x.toFixed(1)} 18v${i % 5 ? 4 : 7}" style="stroke:var(--ink2)"/>`; }
  return raw(`<svg width="${W}" height="26" style="margin-top:12px"><rect x=".5" y=".5" width="${W - 1}" height="15" fill="none" style="stroke:var(--rule)"/><rect x="0" y="0" width="${(W * Math.max(0, Math.min(1, frac))).toFixed(1)}" height="16" fill="url(#p-hatch)"/>${t}</svg>`);
}

/* =====================================================================
   10. ALERTS (home "Eslatmalar")
   ===================================================================== */
function buildAlerts() {
  const t = today(), out = [], pays = S.debts.payments;
  for (const d of S.debts.debts) {
    if (!d.due) continue;
    const rem = calc.debtRemaining(d, pays); if (rem <= 0) continue;
    const rd = relDays(d.due, t);
    if (!rd.late && rd.k > 3) continue;
    const p = personById(d.pid); if (!p) continue;
    out.push({
      href: '#qarz-' + p.id, title: p.name, amount: money(rem, d.currency), late: rd.late, k: rd.k,
      sub: (d.dir === 'given' ? (rd.late ? 'Qaytarishi kerak edi: ' : 'Qaytarish muddati: ') : (rd.late ? 'Qaytarishim kerak edi: ' : 'Men qaytarishim kerak: ')) + dMid(d.due),
      stamp: rd.text,
    });
  }
  for (const l of S.loans.loans) {
    if (l.type === 'card') {
      const cs = calc.cardSummary(l, S.loans.payments, t);
      if (!cs.due) continue;
      const rd = relDays(cs.nextDue, t);
      if (rd.k > 7) continue;
      out.push({ href: '#kredit-' + l.id, title: l.name, sub: 'Minimal toʻlov: ' + dMid(cs.nextDue), amount: fmt(cs.minPay - cs.paidCycle), late: false, k: rd.k, stamp: rd.text });
      continue;
    }
    const s = calc.loanSummary(l, S.loans.payments, t);
    if (s.closed) continue;
    if (s.overdue.length) {
      const first = s.overdue[0], rd = relDays(first.due, t);
      out.push({ href: '#kredit-' + l.id, title: l.name, sub: (s.overdue.length > 1 ? `${s.overdue.length} ta toʻlov oʻtib ketdi, ` : 'Kredit toʻlovi: ') + dMid(first.due), amount: fmt(sum(s.overdue, 'total')), late: true, k: rd.k, stamp: rd.text });
    } else if (s.next) {
      const rd = relDays(s.next.due, t);
      if (rd.k <= 7) out.push({ href: '#kredit-' + l.id, title: l.name, sub: 'Kredit toʻlovi: ' + dMid(s.next.due), amount: fmt(s.next.total), late: false, k: rd.k, stamp: rd.text });
    }
  }
  // category limits exceeded this month
  const st = calc.monthStats(allTx(), ymOf(t));
  for (const c of S.settings.cats) {
    if (c.type !== 'exp' || !c.limit) continue;
    const sp = st.byCat[c.id] || 0;
    if (sp > c.limit) out.push({ href: '#sozlamalar', title: catName(c.id) + ' limiti', sub: `Limit ${fmt(c.limit)}, sarflandi ${fmt(sp)}`, amount: '+' + fmt(sp - c.limit), late: true, k: 0, stamp: 'Oshdi' });
  }
  out.sort((a, b) => (b.late - a.late) || (a.k - b.k));
  return out;
}

  } else if (isCur) {

      <div class="split"><div><div class="lbl">Oy chiqimi</div><div class="mono ${st.expense ? 'exp' : ''}" style="font-size:22px;margin-top:2px">${st.expense ? MINUS : ''}${fmt(st.expense)} <span class="su">soʻm</span></div></div>
      <div><div class="lbl">Kun</div><div class="mono" style="font-size:22px;margin-top:2px">${dl.daysLeft}</div></div></div>`;
  } else {
    hero = html`<div class="lbl">${monthTitle(ym)} chiqimi</div>
      <div class="hero-n disp ${st.expense ? 'exp' : ''}" data-fit><span>${st.expense ? MINUS : ''}${fmt(st.expense)}</span><span class="u">soʻm</span></div>
      <div class="split"><div><div class="lbl">Kirim</div><div class="mono ${st.income ? 'inc' : ''}" style="font-size:22px;margin-top:2px">${st.income ? '+' : ''}${fmt(st.income)}</div></div>
      <div><div class="lbl">Yozuv</div><div class="mono" style="font-size:22px;margin-top:2px">${st.count}</div></div></div>`;
  }

  const accs = s.accounts.filter(a => !a.archived);

    <div class="sechead"><h2>Hisoblar</h2><span class="mono" style="font-size:20px">${tb.total < 0 ? MINUS : ''}${fmt(tb.total)}</span></div>

    ${tb.missingRate ? html`<div class="lbl" style="font-size:13.5px;margin-top:6px">USD kursi kiritilmagan — dollar hisoblar jamiga qoʻshilmadi.</div>` : ''}

  </section>`;

  // recent receipt
  let rc;
  const monthTx = txs.filter(x => x.date.startsWith(ym));
  if (!monthTx.length) {
    rc = html`<div class="empty" style="padding:14px 0 4px"><div class="serif">Daftar hali toza</div><p>Pastdagi <b>+</b> tugmasi bilan birinchi yozuvni qoʻshing.</p></div>`;
  } else if (isCur) {

      ${older.map(x => html`<div class="dash" style="margin-top:${tod.length ? 12 : 0}px"></div>${recLine(x, 'rel')}`)}`;
  } else {

  const recSec = html`<section class="sec"><div class="receipt">${edge('top')}

  return html`<header class="mast">
      <button class="ibtn" data-act="month" data-d="-1" aria-label="Oldingi oy">${ic('chevL', 20)}</button>

    <div class="wrap">
      <section style="margin-top:26px">${isCur ? greetLine() : ''}${hero}</section>
      ${isCur ? html`${budgetSec}${alertSec}${accSec}` : html`${s.budget > 0 ? budgetSec : ''}${spendSec}`}${recSec}
    </div>${syncNote()}`;
}

function personLedger(pid) {
  const debts = S.debts.debts.filter(d => d.pid === pid), ids = new Set(debts.map(d => d.id));
  const pays = S.debts.payments.filter(p => ids.has(p.debtId));
  const rows = [];
  for (const d of debts) rows.push({ kind: 'debt', id: d.id, date: d.date, ca: d.createdAt || 0, d, amount: d.amount, currency: d.currency });
  for (const p of pays) { const d = debts.find(x => x.id === p.debtId); rows.push({ kind: p.kind === 'forgive' ? 'forgive' : 'pay', id: p.id, date: p.date, ca: p.createdAt || 0, d, p, amount: p.amount, currency: d.currency }); }
  rows.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.ca - b.ca);
  let run = 0;
  const rate = S.settings.usdRate;
  for (const r of rows) {
    const uz = calc.toUZS(r.amount, r.currency, r.currency === 'USD' ? (rate || r.d.rate) : 1);
    const sgn = r.d.dir === 'given' ? 1 : -1;
    run += r.kind === 'debt' ? sgn * uz : -sgn * uz;
    r.run = run;
  }
  return { debts, pays, rows };
}

  diff: 'Asosiy qarz har oy teng qismda toʻlanadi, foiz esa qolgan qarzga hisoblanadi: birinchi toʻlovlar katta, keyin har oy kamayadi.',
  flat: 'Ustama bilan jami narx oylar soniga teng boʻlinadi — har oy bir xil summa toʻlanadi.',

/** stacked monthly bars: principal (ink) at the bottom, interest (blue) on top */
function schemeBars(rows, W, H = 72) {
  const n = rows.length, gap = n > 30 ? 0.6 : n > 14 ? 1.5 : 3, bw = Math.max(0.6, (W - gap * (n - 1)) / n);
  const M = Math.max(...rows.map(r => r.total)) || 1;
  let g = '';
  rows.forEach((r, i) => {
    const x = (i * (bw + gap)).toFixed(2), hp = r.principal / M * H, hi = r.interest / M * H;
    g += `<rect x="${x}" y="${(H - hp).toFixed(2)}" width="${bw.toFixed(2)}" height="${hp.toFixed(2)}" style="fill:var(--ink)"/>`;
    if (hi > 0.3) g += `<rect x="${x}" y="${(H - hp - hi).toFixed(2)}" width="${bw.toFixed(2)}" height="${hi.toFixed(2)}" style="fill:var(--sig)"/>`;
  });
  return raw(`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg>`);
}

function viewKreditlar() {

   12. COMPONENTS — layers (sheets/dialogs), toast, fit-text
   ===================================================================== */
const layers = [];
function openLayer({ render, ctx = {}, center = false, onInput, onKey, onClose, onSave, label = '' }) {
  const el = document.createElement('div');
  el.className = 'layer' + (center ? ' center' : '');
  el.innerHTML = `<div class="dim"></div><div class="sheetwrap">${center ? '' : edge('top').s}<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"></div></div>`;
  $('#layers').appendChild(el);
  const L = {
    el, ctx, render, onInput, onKey, onClose, onSave, closed: false,
    sheet: el.querySelector('.sheet'),
    rerender() { const st = this.sheet.scrollTop; this.sheet.innerHTML = render(ctx, L).s; i18nTree(this.sheet); this.sheet.scrollTop = st; fitAll(this.sheet); },
    part(sel, content) { const n = this.sheet.querySelector(sel); if (n) { n.innerHTML = sv(content); i18nTree(n); fitAll(n.parentElement || n); } },
    close() {
      if (this.closed) return; this.closed = true;
      el.remove(); const i = layers.indexOf(L); if (i >= 0) layers.splice(i, 1);
      if (!layers.length) document.body.classList.remove('lock');
      if (onClose) onClose(L);
      tgBackSync(); tgDirtySync();
    },
  };
  el.querySelector('.dim').addEventListener('click', () => L.close());
  layers.push(L);
  document.body.classList.add('lock');
  tgBackSync();
  L.rerender();
  return L;
}
const topLayer = () => layers[layers.length - 1];
function closeAllLayers() { while (layers.length) layers[layers.length - 1].close(); }
const sheetHead = (title, sub) => html`<div class="shead"><div style="min-width:0"><h3>${title}</h3>${sub ? html`<div class="lbl" style="font-size:14px;margin-top:2px">${sub}</div>` : ''}</div><button class="ibtn" data-act="close" aria-label="Yopish">${ic('x', 22)}</button></div>`;

let toastTimer;
function warn(msg) { hap('error'); toast(msg); }
function toast(msg, undo) {
  const old = $('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = html`<span>${msg}</span>${undo ? html`<button type="button">Bekor qilish</button>` : ''}`.s;
  i18nTree(el);
  document.body.appendChild(el);
  if (undo) el.querySelector('button').addEventListener('click', () => { el.remove(); undo(); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), undo ? 6500 : 2800);
}
function confirmDlg({ title, text, ok = 'Ha', danger = false, typed = null }) {
  if (!typed && tgv('6.2') && WA.showConfirm) {
    return new Promise(resolve => { try { if (danger) hap('warning'); WA.showConfirm(`${T(title)}\n\n${T(text)}`.slice(0, 250), v => resolve(!!v)); } catch (e) { resolve(false); } });
  }
  return new Promise(resolve => {
    let done = false;

  if (open.length === 1) txt += `${dMid(first.date)} kuni olgan ${money(first.amount, first.currency)}${first.currency === 'USD' ? '' : ' soʻm'} qarzingiz boʻyicha eslatib qoʻymoqchi edim. Hozirgi qoldiq: ${money(calc.debtRemaining(first, S.debts.payments), first.currency)}${first.currency === 'USD' ? '' : ' soʻm'}.`;
  else txt += `Sizdagi qarzlar boʻyicha eslatib qoʻymoqchi edim. Umumiy qoldiq: ${fmt(tot)} soʻm.`;
  if (due) txt += due < today() ? ` Kelishilgan muddat (${dMid(due)}) oʻtib ketdi.` : ` Kelishilgan muddat: ${dMid(due)}.`;

function loanPreview(c) {
  const term = parseNum(c.term), issued = c.issued || today(), payDay = Math.min(31, Math.max(1, parseNum(c.payDay) || parseD(issued).getDate()));
  const firstDue = addMonths(issued, 1, payDay);
  if (c.type === 'bank') {
    const P = parseNum(c.principal), r = parseFloatUz(c.rate);
    if (!P || !term) return html`<span class="lbl">Summa, foiz va muddatni kiriting — oylik toʻlov shu yerda chiqadi.</span>`;
    const rows = calc.genRows({ scheme: c.scheme, balance: P, rate: r, n: term, firstDue, payDay });
    const tot = sum(rows, 'total');
    const adj = adjPreview(c, { type: 'bank', scheme: c.scheme, principal: P, rate: r, term, firstDue, payDay });
    if (adj) return html`<div class="dl"><div>Shartnomadagi oylik toʻlov<span class="lead"></span><span class="mono">${fmt(rows[0].total)}</span></div></div>${adj}`;
    return html`<div class="dl">
      <div>${c.scheme === 'diff' ? 'Birinchi toʻlov' : 'Oylik toʻlov'}<span class="lead"></span><span class="mono" style="font-weight:700;font-size:15px">${fmt(rows[0].total)}</span></div>
      ${c.scheme === 'diff' ? html`<div>Oxirgi toʻlov<span class="lead"></span><span class="mono">${fmt(rows[rows.length - 1].total)}</span></div>` : ''}
      <div>Jami toʻlanadi<span class="lead"></span><span class="mono">${fmt(tot)}</span></div>
      <div>Shundan foiz<span class="lead"></span><span class="mono">${fmt(tot - P)}</span></div>
      <div>Birinchi toʻlov sanasi<span class="lead"></span><span class="mono">${dShort(firstDue, true)}</span></div></div>`;
  }
  if (c.type === 'installment') {
    const T = effTotal(c), P = parseNum(c.principal);
    if (!T || !term) return html`<span class="lbl">Jami narx (yoki tovar narxi va ustama %) hamda muddatni kiriting.</span>`;
    const adj = P <= T ? adjPreview(c, { type: 'installment', scheme: 'flat', principal: P || T, total: T, rate: 0, term, firstDue, payDay }) : '';
    if (adj) return html`<div class="dl"><div>Shartnomadagi oylik toʻlov<span class="lead"></span><span class="mono">${fmt(Math.round(T / term))}</span></div></div>${adj}`;
    return html`<div class="dl">
      <div>Oylik toʻlov<span class="lead"></span><span class="mono" style="font-weight:700;font-size:15px">${fmt(Math.round(T / term))}</span></div>

      <div>Birinchi toʻlov sanasi<span class="lead"></span><span class="mono">${dShort(firstDue, true)}</span></div></div>
      ${P > T ? html`<div class="box warn" style="margin-top:8px">Tovar narxi jami narxdan katta boʻlishi mumkin emas.</div>` : ''}`;

  return lim ? html`<div class="dl"><div>Mavjud<span class="lead"></span><span class="mono">${fmt(Math.max(0, lim - used))}</span></div><div>Minimal toʻlov<span class="lead"></span><span class="mono">${fmt(used ? Math.min(used, Math.ceil(used * (parseFloatUz(c.minPct) || 10) / 100 / 1000) * 1000) : 0)}</span></div></div>` : html`<span class="lbl">Limit va ishlatilgan summani kiriting.</span>`;

/** The loan form's “early repayments before the app” part: the schedule from today on, built exactly the way
 *  it will be saved (calc.buildSchedule with loan.adj). '' when those fields are empty. */
/** the month the bank's numbers refer to: kept from the saved loan while those numbers are unchanged,
 *  otherwise “now” = the paid-months field */
function adjAfterOf(c) {
  const bal = parseNum(c.nowBal), pay = parseNum(c.nowPay), o = c.adj0;
  return o && (o.bal || 0) === bal && (o.pay || 0) === pay ? o.after : parseNum(c.prepaid);
}
function adjPreview(c, tmp) {
  const bal = parseNum(c.nowBal), pay = parseNum(c.nowPay);
  if (!bal && !pay) return '';
  const k = Math.min(adjAfterOf(c), tmp.term);
  if (!(k > 0) || k >= tmp.term) return html`<div class="box warn" style="margin-top:8px">${k >= tmp.term ? 'Toʻlangan oylar muddatdan kam boʻlishi kerak.' : 'Avval toʻlangan oylar sonini kiriting.'}</div>`;
  const flat = tmp.scheme === 'flat';
  const base = calc.adjBase(tmp.scheme, tmp.rate, tmp.term - k, bal, pay);
  if (!base) return '';
  const old = calc.buildSchedule(tmp).slice(k), key = flat ? 'total' : 'principal';
  if (base.error) {
    // say what does not fit and what would: a balance typed from the contract (no early repayments) is the usual slip
    const left = tmp.term - k, oldBal = sum(old, key);
    const nb = v => fmt(v).replace(/ /g, '\u00a0'); // a number never breaks across lines
    const lines = [
      base.months === Infinity ? `Oyiga ${nb(pay)} foizni ham qoplamaydi — ${nb(bal)} qarz bu toʻlov bilan yopilmaydi.`
        : `Oyiga ${nb(pay)} bilan ${nb(bal)} qarz ${base.months} oyda yopiladi, shartnomada esa ${left} oy qolgan.`,
      oldBal > 0 && Math.abs(bal - oldBal) <= oldBal * 0.01 ? `${nb(bal)} — shartnoma boʻyicha, qoʻshimcha toʻlovlarsiz qoladigan qarz.` : '',
      flat ? `Toʻlov ${nb(pay)} boʻlsa, qolgan qarz ≈ ${nb(base.fit)} boʻlishi kerak.` : `Toʻlov ${nb(pay)} boʻlsa, qolgan asosiy qarz ≈ ${nb(base.fit)} boʻlishi kerak.`,
      'Qoldiqni bank ilovasidan tekshiring yoki uni boʻsh qoldiring — oylik toʻlovning oʻzi yetadi.',
    ].filter(Boolean);
    return html`<div class="box warn adj-err" style="margin-top:8px">${lines.map(t => html`<div>${t}</div>`)}</div>`;
  }
  const tail = calc.buildSchedule({ ...tmp, adj: { after: k, bal, pay } }).slice(k);
  if (!tail.length) return '';
  const extra = sum(old, key) - sum(tail, key), saved = flat ? 0 : sum(old, 'interest') - sum(tail, 'interest');
  return html`<div class="dl" style="margin-top:6px">
    <div>${tmp.scheme === 'diff' ? 'Keyingi toʻlov' : 'Hozirgi oylik toʻlov'}<span class="lead"></span><span class="mono" style="font-weight:700;font-size:15px">${fmt(tail[0].total)}</span></div>
    <div>${flat ? 'Qolgan qarz' : 'Qolgan asosiy qarz'}<span class="lead"></span><span class="mono">${fmt(sum(tail, key))}</span></div>
    <div>Qolgan toʻlovlar<span class="lead"></span><span class="mono">${tail.length}</span></div>
    <div>Tugash<span class="lead"></span><span class="mono">${dShort(tail[tail.length - 1].due, true)}</span></div>
    ${extra > 0 ? html`<div>Ilovadan oldin qoʻshimcha toʻlangan<span class="lead"></span><span class="mono">≈ ${fmt(extra)}</span></div>` : ''}
    ${saved > 0 ? html`<div>Foizdan tejaladi<span class="lead"></span><span class="mono pos">${fmt(saved)}</span></div>` : ''}
  </div>`;
}

function buyPlan(planId, gift, note) {
  if (!serverReady()) { toast('Premium sotuvi tez orada ochiladi'); return Promise.resolve(false); }
  if (!(WA.openInvoice && tgv('6.1'))) { warn('Telegram ilovasini yangilang — toʻlov oynasi ochilmadi'); return Promise.resolve(false); }
  return api('/api/invoice', { plan: planId, gift: !!gift, note: note || '' }).then(res => new Promise(resolve => {
    WA.openInvoice(res.link, status => {
      if (status === 'paid') { hap('success'); meRefresh().then(() => resolve(true)); }
      else { if (status === 'failed') warn('Toʻlov amalga oshmadi'); resolve(false); }
    });
  })).catch(e => { warn(e.message || 'Xatolik'); return false; });
}

async function adminGrantGo(L) {
  const c = L.ctx;
  if (c.busy || !serverReady()) return;
  if (c.mode === 'user' && !c.who.trim()) { warn('@username yoki Telegram ID yozing'); return; }
  c.busy = true; L.rerender();
  try {
    if (c.mode === 'user') {
      const r = await api('/api/admin/premium', { user: c.who.trim(), months: c.months });
      c.done = { name: r.user.name, months: r.months, until: r.until };
    } else {
      const r = await api('/api/admin/gift', { months: c.months });
      c.done = { link: r.link, months: r.months, code: r.code };
    }
    hap('success'); L.dirty = false;
  } catch (e) { warn(e.message || 'Xatolik'); }
  c.busy = false;
  if (!L.closed) L.rerender();
}

async function shareDebt(pid) {
  if (!serverReady()) { toast('Bu imkoniyat tez orada ochiladi'); return; }
  const P = personById(pid); if (!P) return;
  const sm = calc.debtSummary(S.debts, S.settings.usdRate).people[pid];
  const d = sm && sm.open.slice().sort((a, b) => (a.date < b.date ? 1 : -1))[0];
  if (!d) { warn('Ochiq qarz yoʻq'); return; }
  try {
    const res = d.share ? { link: `https://t.me/${(ME && ME.bot && ME.bot.username) || ''}?start=debt_${d.share}` } : await api('/api/debt-share', { dir: d.dir, amount: calc.debtRemaining(d, S.debts.payments), currency: d.currency, date: d.date, due: d.due || null, note: d.note || null, person: P.name });
    if (res.token) { d.share = res.token; commit(['debts']); }
    const amt = money(calc.debtRemaining(d, S.debts.payments), d.currency) + (d.currency === 'USD' ? '' : ' soʻm');
    const text = d.dir === 'given' ? `Salom, ${P.name}! Xarajat daftarimga ${amt} qarzni yozib qoʻydim. Tasdiqlab qoʻying:` : `Salom, ${P.name}! Sizdan olgan ${amt} qarzimni yozib qoʻydim. Tasdiqlab qoʻying:`;
    WA.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(res.link) + '&text=' + encodeURIComponent(T(text)));
    setTimeout(sharesRefresh, 4000);
  } catch (e) { warn(e.message || 'Xatolik'); }
}

/* ---------- bot reminders (Premium) ---------- */
function reminderItems() {
  const t = today(), until = addDays(t, 60), items = [];
  for (const l of S.loans.loans) {
    if (l.type === 'card') {
      const cs = calc.cardSummary(l, S.loans.payments);
      if (cs.due && cs.nextDue <= until) items.push({ id: `card-${l.id}-${cs.nextDue}`, date: cs.nextDue, text: `${l.name}: minimal toʻlov ${fmt(cs.minPay - cs.paidCycle)} soʻm` });
      continue;
    }
    const s = calc.loanSummary(l, S.loans.payments);
    for (const r of s.unpaid) if (r.due >= addDays(t, -3) && r.due <= until) items.push({ id: `loan-${r.id}`, date: r.due < t ? t : r.due, text: `${l.name}: ${fmt(r.total)} soʻm toʻlov` });
  }
  for (const d of S.debts.debts) {
    const rem = calc.debtRemaining(d, S.debts.payments), p = personById(d.pid);
    if (rem > 0 && d.due && d.due >= addDays(t, -3) && d.due <= until && p) items.push({ id: `debt-${d.id}`, date: d.due < t ? t : d.due, text: `${p.name}: ${money(rem, d.currency)}${d.currency === 'USD' ? '' : ' soʻm'} ${d.dir === 'given' ? 'qaytarishi kerak' : 'qaytarishim kerak'}` });
  }
  return items.sort((a, b) => (a.date < b.date ? -1 : 1)).slice(0, 100).map(x => Object.assign(x, { text: T(x.text).slice(0, 120) }));
}
let remTimer;
function remindersSync(force) {
  if (!serverReady() || !S.settings || !S.settings.botReminders) return;
  if (!force && UIP.remAt === today()) return;
  clearTimeout(remTimer);
  remTimer = setTimeout(() => api('/api/reminders', { enabled: true, items: reminderItems() }).then(() => { UIP.remAt = today(); saveUIP(); }).catch(() => { }), force ? 4000 : 3000);
}
async function toggleReminders() {
  if (!isPremium()) { openPremium('rem'); return; }
  if (!serverReady()) { toast('Bot eslatmalari tez orada ochiladi'); return; }
  const on = !S.settings.botReminders;
  try {
    await api('/api/reminders', on ? { enabled: true, items: reminderItems() } : { enabled: false, items: [] });
    S.settings.botReminders = on; commit(['settings']); UIP.remAt = today(); saveUIP();
    toast(on ? 'Bot har kuni ertalab muddatlarni eslatadi' : 'Bot eslatmalari oʻchirildi');
  } catch (e) { warn(e.message || 'Xatolik'); }
}

async function draftOpen(id) {
  if (!apiOn() || !id) return;
  try {
    const { draft } = await api('/api/draft?id=' + encodeURIComponent(id));
    api('/api/draft/done', { id }).catch(() => { });
    if (!S.settings || !S.settings.onboarded) return;
    aiApplyResult(draft.kind, draft.data, 'Botdan kelgan yozuv — tekshirib, saqlang');
  } catch (e) { warn(e.message || 'Yozuv topilmadi'); }
}
/** open the right form for an AI / bot result: tx → add sheet, loan → loan form, debt → debt form */
function aiApplyResult(kind, data, sub) {
  if (kind === 'tx') {
    const accs = activeAccs(); if (!accs.length) { toast('Avval Sozlamalarda hisob qoʻshing'); return; }
    const hint = String(data.accHint || '').toLowerCase();
    const acc = accs.find(a => hint && (a.name.toLowerCase().includes(hint) || hint.includes(a.name.toLowerCase()))) || accById(defaultAcc());
    const type = data.type === 'inc' ? 'inc' : 'exp';
    const cats = pickCats(type);
    openAdd({ type, prefill: { digits: data.amount ? String(Math.round(data.amount)) : '', cur: data.currency === 'USD' ? 'USD' : acc.currency, accId: acc.id, date: data.date && data.date <= today() ? data.date : today(), note: data.note || '', catId: cats.some(c => c.id === data.catHint) ? data.catHint : undefined } });
    if (sub) toast(sub);
    return;
  }
  const a = aiFinish(aiClean(Object.assign({}, data, { kind })));
  if (a.kind === 'loan') openLoanForm({ prefill: aiLoanPrefill(a) });
  else if (a.kind === 'debt') openDebtForm({ prefill: aiDebtPrefill(a) });
}

function exportFile(filename, data, label) {

function buildCsv() {
  const rows = [['Sana', 'Vaqt', 'Tur', 'Summa', 'Valyuta', 'Kurs', 'Summa (UZS)', 'Kategoriya', 'Hisob', 'Hisobga', 'Izoh']];
  const TN = { exp: 'Chiqim', inc: 'Kirim', tr: 'Oʻtkazma' };
  for (const t of allTx().slice().reverse()) rows.push([t.date, t.time || '', TN[t.type], t.amount, t.currency, t.rate || '', t.uzs, t.type === 'tr' ? '' : catName(t.catId), accName(t.accId), t.toAccId ? accName(t.toAccId) : '', t.note || '']);
  for (const e of debtEvents(() => true).sort((a, b) => a.date < b.date ? -1 : 1)) rows.push([e.date, '', 'Qarz', e.amount, e.currency, '', '', '', e.sub, '', e.title]);
  return '﻿' + rows.map(r => r.map(calc.csvEscape).join(',')).join('\r\n');
}

async function doImport(text) {
  let o;
  try { o = JSON.parse(text); } catch (e) { importError('JSON notoʻgʻri — faylni tekshiring'); return; }
  if (!validBackup(o)) { importError('Bu Xarajat zaxirasi emas'); return; }
  const accs = o.settings.accounts.filter(a => a && typeof a === 'object' && typeof a.id === 'string' && a.name);
  if (!accs.length) { importError('Zaxirada birorta hisob yoʻq — bu faylni tiklab boʻlmaydi. Hozirgi maʼlumotlar oʻzgarmadi.'); return; }
  const ok = await confirmDlg({ title: 'Maʼlumotlarni almashtiramizmi?', text: 'Hozirgi hisoblar, yozuvlar, qarzlar va kreditlar zaxiradagisi bilan almashtiriladi.', ok: 'Tiklash', danger: true });
  if (!ok) return;
  const oldIds = new Set([...localDocIds(), ...Object.keys(Sync.remote)]);
  const keepName = (S.settings && S.settings.name) || (OB.uname || '').trim();
  S = emptyState();
  S.settings = Object.assign(defaultSettings(), o.settings, { onboarded: true, welcomed: true });
  if (!S.settings.name && keepName) S.settings.name = keepName;
  if (o.debts) S.debts = o.debts;
  if (o.loans) S.loans = o.loans;
  S.months = {};
  for (const ym in o.months) if (/^\d{4}-\d{2}$/.test(ym) && o.months[ym] && Array.isArray(o.months[ym].tx)) S.months[ym] = o.months[ym];
  normalizeState();
  const ids = localDocIds();
  for (const id of oldIds) if (!ids.includes(id)) Sync.queue(id); // deletes stale docs remotely
  commit(ids);
  closeAllLayers();
  location.hash = '#asosiy';
  toast('Zaxira tiklandi');
}

  lfAdj: (el, L) => { L.ctx.adjOpen = true; L.rerender(); const i = document.querySelector('.layer input[data-k="nowPay"]'); if (i) i.focus(); },
  lfSave: (el, L) => {
    const c = L.ctx, id = c.edit ? c.id : newId('l');
    const payDay = Math.min(31, Math.max(1, parseNum(c.payDay) || parseD(c.issued || today()).getDate()));
    const term = parseNum(c.term);
    let loan;
    if (c.type === 'card') {
      const limit = parseNum(c.limit);
      if (!limit) { warn('Limitni kiriting'); return; }
      loan = { id, type: 'card', name: c.name.trim() || 'Kredit karta', lender: c.lender.trim(), limit, used: parseNum(c.used), minPct: parseFloatUz(c.minPct) || 10, grace: parseNum(c.grace), rate: parseFloatUz(c.cardRate), payDay, status: 'active', createdAt: Date.now() };
    } else {
      if (!term || term > 600) { warn('Muddatni oylarda kiriting'); return; }
      const issued = c.issued || today();
      if (c.type === 'bank') {
        const P = parseNum(c.principal), r = parseFloatUz(c.rate);
        if (!P) { warn('Kredit summasini kiriting'); return; }
        if (r < 0 || r > 200) { warn('Foizni tekshiring'); return; }
        loan = { id, type: 'bank', scheme: c.scheme, name: c.name.trim() || 'Bank krediti', lender: c.lender.trim(), principal: P, rate: r, term, issued, payDay, firstDue: addMonths(issued, 1, payDay), status: 'active', createdAt: Date.now() };
      } else {
        const T = effTotal(c), P = parseNum(c.principal);
        if (!T) { warn('Jami narxni yoki tovar narxi va ustama foizini kiriting'); return; }
        if (P > T) { warn('Tovar narxi jami narxdan katta'); return; }
        loan = { id, type: 'installment', scheme: 'flat', name: c.name.trim() || 'Nasiya', lender: c.lender.trim(), principal: P || T, total: T, rate: 0, term, issued, payDay, firstDue: addMonths(issued, 1, payDay), status: 'active', createdAt: Date.now() };
      }
      // early repayments made before the app: continue the schedule from the bank's numbers
      const bal = parseNum(c.nowBal), pay = parseNum(c.nowPay);
      loan.adj = null;
      if (bal || pay) {
        const after = adjAfterOf(c);
        if (!(after > 0)) { warn('Avval toʻlangan oylar sonini kiriting.'); return; }
        if (after >= term) { warn('Toʻlangan oylar muddatdan kam boʻlishi kerak.'); return; }
        const base = calc.adjBase(loan.scheme, loan.rate, term - after, bal, pay);
        if (base && base.error) { warn(base.error); return; }
        loan.adj = { after, bal, pay };
      }
    }
    if (c.edit) {
      const patch = Object.assign({}, loan); delete patch.id; delete patch.status; delete patch.createdAt;
      const res = editLoan(id, patch, Math.min(parseNum(c.prepaid), term || 0));
      if (res.error) { warn(res.error); return; }
      L.close();
      toast('Kredit yangilandi', () => { const u = S.loans._u; S.loans = res.snap; S.loans._u = u; commit(['loans']); });
      return;
    }
    addLoan(loan, Math.min(parseNum(c.prepaid), term || 0));
    L.close();
    location.hash = '#kredit-' + id;
    toast('Kredit qoʻshildi');
  },

  recSave: (el, L) => { const r = S.settings.recurring.find(x => x.id === L.ctx.id); const a = r.currency === 'USD' ? parseFloatUz(String(L.ctx.amount).replace(/\s/g, '')) : parseNum(L.ctx.amount); if (!(a > 0)) { warn('Summani kiriting'); return; } r.amount = a; commit(['settings']); L.close(); toast('Saqlandi'); },
  recStop: (el, L) => { const r = S.settings.recurring.find(x => x.id === L.ctx.id); r.active = false; commit(['settings']); L.close(); toast('Takroriy toʻlov toʻxtatildi', () => { r.active = true; commit(['settings']); }); },
  theme: (el) => { S.settings.theme = el.dataset.t; applyTheme(); commit(['settings']); },
  exportCsv: () => exportFile(`xarajat-${today()}.csv`, buildCsv(), 'CSV eksport'),
  exportJson: () => exportFile(`xarajat-zaxira-${today()}.json`, buildBackup(), 'JSON zaxira'),
  importJson: () => openImport(),
  importDo: (el, L) => { if (!L.ctx.text.trim()) { warn('Matnni joylashtiring yoki fayl tanlang'); return; } doImport(L.ctx.text); },
  wipe: async () => {
    const first = await confirmDlg({ title: 'Hammasini oʻchirmoqchimisiz?', text: 'Hisoblar, yozuvlar, qarzlar va kreditlar butunlay oʻchadi. Bu tugmani bilmasdan bosgan boʻlsangiz, “Bekor”ni tanlang.', ok: 'Davom etish', danger: true });
    if (!first) return;
    const ok = await confirmDlg({ title: 'Hammasini oʻchiramizmi?', text: 'Barcha hisoblar, yozuvlar, qarzlar va kreditlar shu qurilmadan va bulutdan oʻchiriladi. Avval JSON zaxira olishni maslahat beramiz.', ok: 'Oʻchirish', danger: true, typed: 'OʻCHIRISH' });
    if (!ok) return;
    await Sync.deleteAll();
    S = emptyState(); VER++;
    try { localStorage.removeItem(LS_KEY); } catch (e) { }
    Object.assign(OB, { step: 'intro', uname: null, accounts: [{ name: 'Naqd', currency: 'UZS', start: '' }, { name: 'Karta', currency: 'UZS', start: '' }], budget: '', rate: '' });
    location.hash = '#asosiy'; render(); toast('Hammasi oʻchirildi');
  },
  dlgYes: (el, L) => { if (!typedOk(L.ctx.v, L.ctx.typed)) return; L.ctx.fin(true); L.close(); },
  dlgNo: (el, L) => { L.ctx.fin(false); L.close(); },
  /* onboarding */
  obCur: (el) => { OB.accounts[+el.dataset.i].currency = el.dataset.c; render(); },
  obAdd: () => { OB.accounts.push({ name: '', currency: 'UZS', start: '' }); render(); const ins = $$('[data-ob="name"]'); ins[ins.length - 1].focus(); },
  obDel: (el) => { OB.accounts.splice(+el.dataset.i, 1); render(); },
  obNext: () => {
    const accs = OB.accounts.filter(a => a.name.trim());
    if (!accs.length) { warn('Kamida bitta hisob nomini yozing'); return; }
    OB.step = 2; render(); window.scrollTo(0, 0);
  },
  obBack: () => { OB.step = 1; render(); },
  obTo: (el) => { OB.step = el.dataset.s === 'name' ? 'name' : 'intro'; render(); window.scrollTo(0, 0); },
  obStart: () => { OB.step = 'name'; render(); window.scrollTo(0, 0); const i = $('[data-ob="uname"]'); if (i && !i.value) i.focus(); },
  obName: () => {
    const n = (OB.uname || '').trim().replace(/\s+/g, ' ');
    if (!n) { warn('Ismingizni yozing'); const i = $('[data-ob="uname"]'); i && i.focus(); return; }
    OB.uname = n;
    if (S.settings && S.settings.onboarded) { // existing user: just meet them
      S.settings.name = n; S.settings.welcomed = true; commit(['settings']);
      location.hash = '#asosiy'; toast(`Xush kelibsiz, ${n}!`); return;
    }
    OB.step = 1; render(); window.scrollTo(0, 0);
  },
  obFinish: () => {
    const s = defaultSettings();
    s.onboarded = true; s.welcomed = true; s.name = (OB.uname || '').trim(); s.lang = UIP.lang || 'uz';
    s.accounts = OB.accounts.filter(a => a.name.trim()).map(a => ({ id: newId('a'), name: a.name.trim(), currency: a.currency, start: a.currency === 'USD' ? parseFloatUz(String(a.start).replace(/\s/g, '')) : parseNum(a.start) }));
    s.budget = parseNum(OB.budget); s.usdRate = parseNum(OB.rate);
    S.settings = s;
    commit(['settings']);
    location.hash = '#asosiy';
    toast('Daftar tayyor. + tugmasi bilan birinchi yozuvni qoʻshing');
  },
};

/* =====================================================================
   18. ROUTER, RENDER, EVENTS, BOOT
   ===================================================================== */
const ROUTES = ['asosiy', 'tarix', 'kalendar', 'qarzlar', 'kreditlar', 'sozlamalar'];
function route() {
  let h = '';
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = ''; }
  let m;
  if ((m = /^qarz-([A-Za-z0-9-]+)$/.exec(h))) return { name: 'qarz', id: m[1] };
  if ((m = /^kredit-([A-Za-z0-9-]+)$/.exec(h))) return { name: 'kredit', id: m[1] };
  return { name: ROUTES.includes(h) ? h : 'asosiy' };
}
function applyTheme() {
  const t = (S.settings && S.settings.theme) || 'light';
  let dark = t === 'dark';
  if (t === 'auto') {
    if (IN_TG && WA.colorScheme) dark = WA.colorScheme === 'dark';
    else { try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { } }
  }
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  tgColors(dark);
  const m = $('meta[name="theme-color"]'); if (m) m.content = dark ? '#121110' : '#F1ECE1';
}
let renderQueued = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
function render() {
  LANG = curLang(); document.documentElement.lang = LANG === 'ru' ? 'ru' : 'uz';
  applyTheme();
  const app = $('#app'), tb = $('#tabbar');
  const ae = document.activeElement, focusKey = ae && ae.dataset && (ae.dataset.ui || (ae.dataset.ob ? ae.dataset.ob + ae.dataset.i : null));
  const caret = focusKey && typeof ae.selectionStart === 'number' ? ae.selectionStart : null;
  if (!S.settings || !S.settings.onboarded || !S.settings.welcomed) {
    app.innerHTML = viewOnboarding().s; app.className = 'noTab'; tb.className = ''; tb.innerHTML = '';
  } else {
    const r = route();
    let v, tab = r.name;
    try {
      switch (r.name) {
        case 'tarix': v = viewTarix(); break;
        case 'kalendar': v = viewKalendar(); tab = 'tarix'; break;
        case 'qarzlar': v = viewQarzlar(); break;
        case 'qarz': v = viewQarz(r.id); tab = 'qarzlar'; break;
        case 'kreditlar': v = viewKreditlar(); break;
        case 'kredit': v = viewKredit(r.id); tab = 'kreditlar'; break;
        case 'sozlamalar': v = viewSozlamalar(); tab = ''; break;
        default: v = viewHome(); tab = 'asosiy';
      }
    } catch (e) {
      console.error(e);
      v = html`<div class="wrap" style="padding-top:60px"><div class="empty"><div class="serif">Nimadir xato ketdi</div><p>${String(e && e.message || e)}</p><a class="btn ghost sm" href="#asosiy" style="margin-top:14px">Asosiyga</a></div></div>`;
    }
    app.innerHTML = v.s; app.className = '';
    tb.className = 'tabbar'; tb.innerHTML = tabbar(tab).s;
  }
  if (focusKey) {
    const el = $(`[data-ui="${focusKey}"]`) || $$('[data-ob]').find(x => x.dataset.ob + x.dataset.i === focusKey);
    if (el) { el.focus(); if (caret != null) try { el.setSelectionRange(caret, caret); } catch (e) { } }
  }
  i18nTree(app); i18nTree(tb);
  fitAll(app);
  tgBackSync();
}

function onInput(e) {
  const el = e.target;
  if (el.dataset.ob) {
    const k = el.dataset.ob;
    if (k === 'budget' || k === 'rate' || k === 'start') { const n = parseNum(el.value); el.value = n ? grp(n) : ''; }
    if (k === 'name' || k === 'start') OB.accounts[+el.dataset.i][k] = el.value; else OB[k] = el.value;
    if (k === 'uname') { const p = $('#obPlate'); if (p) { p.textContent = T(plateTitle(el.value)); p.classList.toggle('empty', !el.value.trim()); } }
    return;
  }
  if (el.dataset.ui) {
    UI[el.dataset.ui] = el.value; UI.histLimit = 0;
    clearTimeout(onInput.t); onInput.t = setTimeout(render, 120);
    return;
  }
  if (el.dataset.k) {
    const layerEl = el.closest('.layer'), L = layers.find(x => x.el === layerEl);
    if (!L) return;
    let v = el.value;
    if (el.dataset.type === 'num') { const n = parseNum(v); v = n ? grp(n) : ''; if (el.value !== v) el.value = v; }
    L.ctx[el.dataset.k] = v;
    if (!L.dirty) { L.dirty = true; tgDirtySync(); }
    if (L.onInput) L.onInput(el.dataset.k, el, L);
  }
}
function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.getAttribute('aria-disabled') === 'true' || el.disabled) { e.preventDefault(); return; }
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  const layerEl = el.closest('.layer'), L = layerEl ? layers.find(x => x.el === layerEl) : null;
  e.preventDefault();
  const v0 = VER, act = el.dataset.act;
  let r;
  try { r = fn(el, L, e); } catch (err) { console.error(err); hap('error'); toast('Xatolik: ' + (err.message || err)); return; }
  Promise.resolve(r).then(() => { if (VER !== v0) hap(HAP_DEL.test(act) ? 'light' : HAP_OK.test(act) ? 'success' : 'none'); }).catch(() => { });
}
const HAP_DEL = /Delete|Undo|recStop|wipe|accRemove/;
const HAP_OK = /Save|^fgDo$|^obFinish$|^amtSave$|^theme$/;
function onKey(e) {
  const L = topLayer();
  if (e.key === 'Escape' && L) { L.close(); return; }
  if (e.key === 'Enter' && e.target && e.target.dataset && /^(search|debtSearch)$/.test(e.target.dataset.ui || '')) { e.preventDefault(); e.target.blur(); return; }
  if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.ob === 'uname') { e.preventDefault(); ACT.obName(); return; }
  if (L && L.onKey) L.onKey(e, L);
}
function onChange(e) {
  const el = e.target;
  if (el.dataset.file === 'import' && el.files && el.files[0]) {
    const f = el.files[0], rd = new FileReader();
    rd.onload = () => doImport(String(rd.result || ''));
    rd.onerror = () => toast('Faylni oʻqib boʻlmadi');
    rd.readAsText(f);
  }
}

let lastDay = null;
/* compact sheet layout when the space left after Telegram's insets is short */
function fitViewport() {
  const cs = getComputedStyle(document.documentElement);
  const px = v => { const d = document.createElement('div'); d.style.cssText = `position:absolute;visibility:hidden;height:${v}`; document.body.appendChild(d); const h = d.offsetHeight; d.remove(); return h; };
  const avail = window.innerHeight - px('var(--sat)') - px('var(--sab)');
  document.documentElement.classList.toggle('short', avail < 760);
  void cs;
}
function boot() {
  tgInit();
  fitViewport(); window.addEventListener('load', fitViewport);
  try { if (IN_TG) WA.onEvent('viewportChanged', fitViewport); WA && IN_TG && WA.onEvent('safeAreaChanged', fitViewport); WA && IN_TG && WA.onEvent('contentSafeAreaChanged', fitViewport); } catch (e) { }
  loadLocal();
  UI.month = ymOf(today());
  lastDay = today();
  applyTheme();
  materializeRecurring();
  render();
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', () => { closeAllLayers(); UI.histLimit = 0; render(); window.scrollTo(0, 0); });
  // keyboard open/close only changes the height: re-rendering then would re-focus inputs and pop the keyboard back up
  let rz, lastW = window.innerWidth; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { fitViewport(); if (window.innerWidth !== lastW) { lastW = window.innerWidth; render(); } }, 150); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (today() !== lastDay) { if (UI.month === ymOf(lastDay)) UI.month = ymOf(today()); lastDay = today(); }
    materializeRecurring(); scheduleRender();
    Sync.pull();
    sharesRefresh(3000);
  });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); }); } catch (e) { }
  Sync.attach();
  // server side (Premium, gifts, shared debts, reminders, drafts from the bot)
  if (apiOn()) {
    meRefresh().then(() => remindersSync());
    sharesRefresh();
    // the other side answers in the bot at any moment: while an answer is awaited, look again now and then
    setInterval(() => { if (document.visibilityState === 'visible' && sharesWaiting()) sharesRefresh(15000); }, 20000);
    const sp = (WA.initDataUnsafe && WA.initDataUnsafe.start_param) || '';
    const dq = new URLSearchParams(location.search).get('draft') || (sp.startsWith('d_') ? sp.slice(2) : '');
    if (dq) setTimeout(() => draftOpen(dq), 700);
  }
}

/* QA hooks */
window.__xarajat = {
  calc,
  get state() { return S; },
  get ui() { return UI; },
  get syncMode() { return Sync.mode; },
  get syncState() { return Sync.state; },
  allTx, route, render, materializeRecurring, saveTx, deleteTx,
  setToday(d) { TODAY_OVERRIDE = d || null; lastDay = today(); UI.month = ymOf(today()); VER++; render(); },
  reset() { const wipe = Sync.deleteAll(); S = emptyState(); VER++; try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_UI); localStorage.removeItem(LS_KNOWN); } catch (e) { } UIP = {}; closeAllLayers(); render(); return wipe; },
  sync: Sync, syncPull: () => Sync.pull(), inTelegram: IN_TG,
  fmt, compact,
};
boot();
