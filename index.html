<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1ECE1">
<title>Xarajat — daftar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* ===================== TOKENS ===================== */
:root{
  --serif:Newsreader,"LM Roman 12","Latin Modern Roman","GFS Baskerville",Georgia,serif;
  --disp:Newsreader,"LM Roman 17","Latin Modern Roman","GFS Baskerville",Georgia,serif;
  --mono:"JetBrains Mono","Latin Modern Mono","LM Mono 10",ui-monospace,Menlo,Consolas,monospace;
  --monocaps:"JetBrains Mono","Latin Modern Mono Caps","Latin Modern Mono",ui-monospace,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F1ECE1;--paper2:#FBF8F1;--ink:#1C1A16;--ink2:#47423A;--muted:#6B6457;--rule:#CBC2AF;--rule2:#DDD5C4;
  --sig:#2436C9;--sig-ink:#FBF8F1;--sig-soft:rgba(36,54,201,.09);--dng:#B8301C;--dng-soft:rgba(184,48,28,.08);--pos:#1F6B3A;--dim:rgba(28,26,22,.45);
  --shadow:0 1px 0 rgba(60,50,30,.08),0 8px 24px -12px rgba(60,50,30,.25);
  --sat:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  --sab:max(env(safe-area-inset-bottom,0px),calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)));
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#121110;--paper2:#1C1A17;--ink:#EDE7DA;--ink2:#C9C2B3;--muted:#9C9585;--rule:#3B3731;--rule2:#2C2925;
  --sig:#8E9CFF;--sig-ink:#121110;--sig-soft:rgba(142,156,255,.12);--dng:#FF7C67;--dng-soft:rgba(255,124,103,.1);--pos:#7FD39A;--dim:rgba(0,0,0,.62);
  --shadow:0 0 0 1px #2A2723;
  color-scheme:dark;
}
/* ===================== BASE ===================== */
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:inherit}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
#app{padding-bottom:calc(104px + var(--sab))}
#app.noTab{padding-bottom:calc(30px + var(--sab))}
.su{font-family:var(--sans);word-spacing:0;font-size:.82em;opacity:.8;letter-spacing:0}
.serif{font-family:var(--serif);font-weight:400}
.disp{font-family:var(--disp);font-weight:400}
.it{font-style:italic}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;word-spacing:-.32em;letter-spacing:-.01em}
.wrap{padding:0 22px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;color:var(--ink2);border-radius:50%;flex:none}
.ibtn:active{background:var(--sig-soft)}
.pos{color:var(--pos)}
.dng{color:var(--dng)}
.muted{color:var(--muted)}
/* ===================== MASTHEAD ===================== */
.mast{display:flex;align-items:center;padding:calc(10px + var(--sat)) 10px 0 10px;min-height:54px}
.mast h1{font-size:30px;line-height:1;letter-spacing:-.01em;flex:1;display:flex;align-items:baseline;gap:8px;padding-left:2px;min-width:0}
.mast h1 .y{font-size:18px;color:var(--muted)}
.mast .ptitle{font-size:36px;line-height:1;flex:1;padding-left:12px}
.mast .dtitle{font-size:24px;line-height:1.1;flex:1;padding-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mast .ibtn{color:var(--ink)}
.rule2{border:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);height:4px;margin:10px 22px 0}
.dateline{display:flex;justify-content:space-between;gap:12px;padding:8px 22px 0;font-size:13px;color:var(--muted)}
.lbl{font-size:14px;color:var(--muted)}
h2{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.1}
.sec{margin-top:34px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hair{border-top:1px solid var(--rule)}
.dash{border-top:1px dashed var(--rule)}
.hero-n{font-size:84px;line-height:.92;letter-spacing:-.035em;display:flex;align-items:baseline;gap:10px;margin-top:10px;white-space:nowrap;overflow:hidden}
.hero-n .u,.big2 .u{font-family:var(--serif);font-size:26px;letter-spacing:0;color:var(--muted);font-style:italic}
.big2{font-size:64px;line-height:.98;letter-spacing:-.03em;display:flex;align-items:baseline;gap:10px;margin-top:8px;white-space:nowrap;overflow:hidden}
.big2 .u{font-size:24px}
.split{display:grid;grid-template-columns:1fr auto;margin-top:22px;border-top:1px solid var(--rule)}
.split.even{grid-template-columns:1fr 1fr}
.split>div{padding-top:12px;min-width:0}
.split>div+div{border-left:1px solid var(--rule);padding-left:18px}
.split .lbl{font-size:13.5px;line-height:1.3}
.legend{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:10px;margin-top:16px}
.lg{display:flex;align-items:center;gap:7px;font-size:14px;min-width:0}
.lg>span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg .dots,.lead{flex:1;border-bottom:1.5px dotted var(--rule);transform:translateY(-4px);min-width:4px}
.lg .mono{font-size:14px;color:var(--ink2)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0}
.row .mono{font-size:16px}
.acct{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 18px;margin-top:12px}
.acct>button{font-size:12.5px;color:var(--muted);text-align:left;min-height:44px;min-width:44px}
.hit{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:flex-end}
a.row{min-height:44px;align-items:center}
.acct .mono{display:block;font-size:14.5px;color:var(--ink);margin-top:2px}
.note{display:flex;align-items:center;gap:14px;padding:14px 0;min-height:72px;width:100%}
.note .t{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .s{font-size:13px;color:var(--muted);margin-top:2px}
.note .amt{font-size:16px;text-align:right}
.stamp{display:inline-block;border:1.6px solid currentColor;border-radius:4px;padding:2px 7px 1px;font-family:var(--monocaps);font-size:11.5px;letter-spacing:.06em;word-spacing:-.2em;white-space:nowrap;margin-top:6px;text-transform:uppercase;line-height:1.35}
.stamp.d{color:var(--dng);transform:rotate(-4deg)}
.stamp.s{color:var(--sig)}
.stamp.p{color:var(--pos);transform:rotate(-3deg)}
.stamp.m{color:var(--muted)}
.syncnote{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);padding:26px 22px 0;text-align:center}
/* ===================== RECEIPT ===================== */
.receipt{position:relative;margin:16px 6px 0;background:var(--paper2);box-shadow:var(--shadow);padding:22px 20px 26px}
.edge{position:absolute;left:0;width:100%;height:10px;color:var(--paper2);pointer-events:none}
.edge.top{top:-9px}.edge.bot{bottom:-9px;transform:scaleY(-1)}
.rc-head{text-align:center}
.rc-head .serif{font-size:22px;font-style:italic}
.rc-head .mono{font-size:12px;color:var(--muted);margin-top:2px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px;width:100%}
.tx .t{font-size:15.5px;font-weight:500}
.tx .s{font-size:12.5px;color:var(--muted)}
.tx .a{margin-left:auto;font-size:16px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 4px;font-size:14px}
.more{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--sig);font-weight:600;font-size:15px;min-height:44px;margin-top:6px;width:100%}
.strip{margin:30px 6px 0;padding:18px 18px 20px}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dh .serif{font-size:21px;font-style:italic}
.li{display:flex;gap:10px;padding:11px 0;min-height:54px;align-items:flex-start;width:100%}
.li .mk{width:14px;padding-top:4px;flex:none;color:var(--muted)}
.li .bd{flex:1;min-width:0}
.ln{display:flex;align-items:baseline;gap:6px;min-width:0}
.ln .t{font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.ln .a{font-size:15.5px;flex:none}
.li .s{font-size:12.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.virt .t{font-weight:400;color:var(--ink2)}
.totrow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0 0;font-size:14px}
/* ===================== TAB BAR ===================== */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;z-index:30}
.tabbar nav{border-top:1px solid var(--ink);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:0 6px calc(8px + var(--sab));background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);padding-top:10px;min-height:58px;position:relative}
.tab.on{color:var(--ink);font-weight:600}
.tab.on:before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--sig)}
.fab{width:62px;height:62px;border-radius:50%;background:var(--sig);color:var(--sig-ink);display:grid;place-items:center;margin:-20px auto 0;box-shadow:0 0 0 6px var(--bg)}
.fab:active{transform:scale(.96)}
/* ===================== TABS / TYPES ===================== */
.types{display:flex;align-items:flex-end;gap:24px;border-bottom:1px solid var(--rule);margin-top:14px}
.types>a,.types>button{padding:10px 0 12px;font-size:16px;color:var(--muted);position:relative;min-height:44px;min-width:44px;white-space:nowrap;flex:none}
.types.scroll-x{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-right:-22px;padding-right:22px}
.types.scroll-x::-webkit-scrollbar{display:none}
.types.scroll-x>.on:after{bottom:0}
.types>.on{color:var(--ink);font-weight:600}
.types>.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--sig)}
.types .mono{font-size:12px}
.sumline{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13.5px;gap:8px}
.mnav{display:flex;align-items:center;margin-left:-12px;min-width:0}
.mnav .ibtn{width:40px}
/* ===================== CALENDAR ===================== */
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--muted);text-align:center;padding:14px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--ink);border-left:1px solid var(--rule)}
.cal>*{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);height:60px;padding:5px 5px 4px 6px;display:flex;flex-direction:column;justify-content:space-between;position:relative;min-width:0;text-align:left}
.cal .d{font-size:13px}
.cal .v{font-size:11px;text-align:right;word-spacing:-.4em;overflow:hidden}
.cal .v small{font-size:8.5px;margin-left:2px;letter-spacing:-.02em}
.cal .fut .d{color:var(--muted)}
.l1{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.l2{background:color-mix(in srgb,var(--ink) 26%,transparent)}
.l3{background:color-mix(in srgb,var(--ink) 72%,transparent);color:var(--bg)}
.l4{background:var(--ink);color:var(--bg)}
.cal .sel{box-shadow:inset 0 0 0 3px var(--sig)}
.cal .today:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--sig)}
.cal .today .d{font-weight:700}
.scale{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:12px;font-size:12px;color:var(--muted)}
.scale i{width:18px;height:14px;border:1px solid var(--rule);display:block}
/* ===================== DEBTS ===================== */
.daftar{position:relative;margin-top:0}
.daftar:before{content:"";position:absolute;top:0;bottom:0;left:42px;width:1px;background:var(--sig);opacity:.5}
.dsub{padding:16px 0 6px 56px;font-family:var(--serif);font-style:italic;font-size:18px;border-bottom:1px solid var(--rule)}
.dsub .mono{font-family:var(--mono);font-style:normal;font-size:12.5px;color:var(--muted);margin-left:6px}
.drow{display:flex;border-bottom:1px solid var(--rule);min-height:80px;padding:13px 0 12px;width:100%}
.drow .ini{width:42px;font-size:13px;color:var(--muted);padding-top:2px;overflow:hidden;flex:none}
.drow .bd{flex:1;padding-left:14px;min-width:0}
.drow .ln .t{font-size:16px}
.drow .ln .a{font-size:16px}
.drow .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:4px}
.drow .meta>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{min-height:54px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;width:100%;padding:0 14px;text-align:center}
.btn.pri{background:var(--sig);color:var(--sig-ink)}
.btn.ghost{border:1.5px solid var(--ink);color:var(--ink)}
.btn.dngb{border:1.5px solid var(--dng);color:var(--dng)}
.btn.dngfill{background:var(--dng);color:var(--paper2)}
.btn.sm{min-height:44px;font-size:15px}
.btn:disabled,.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.btn:active{filter:brightness(.95)}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.linkrow{display:flex;align-items:center;gap:10px;min-height:52px;color:var(--ink2);font-size:14.5px;border-bottom:1px dashed var(--rule);width:100%}
.led{width:100%;border-collapse:collapse;font-size:12.5px}
.led th{font-weight:500;font-size:11.5px;color:var(--muted);text-align:left;padding:0 3px 8px;border-bottom:1px solid var(--ink);white-space:nowrap}
.led td{padding:10px 3px;border-bottom:1px dashed var(--rule);vertical-align:top;white-space:nowrap}
.led tbody tr{cursor:pointer}
.led .r{text-align:right}
.led td.mono{font-size:12.5px}
.led tfoot td{border-bottom:0;border-top:3px double var(--ink);padding-top:10px;font-weight:700}
.led .sub{display:block;font-size:11.5px;color:var(--muted);font-family:var(--sans);word-spacing:0;overflow:hidden;text-overflow:ellipsis}
.led td.wrapc{white-space:normal}
.handnote{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.5;color:var(--ink2);padding:14px 0 0;background:repeating-linear-gradient(to bottom,transparent 0 26px,var(--rule2) 26px 27px);background-position:0 14px;white-space:pre-wrap;word-break:break-word}
/* ===================== LOANS ===================== */
.contract{border:1px solid var(--ink);padding:3px;margin-top:18px;background:var(--paper2);display:block;width:100%}
.contract>.in{border:1px solid var(--rule);padding:16px 16px 0}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ctop .serif{font-size:24px;line-height:1.1;word-break:break-word}
.terms{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.terms>div{padding:8px 0 8px 10px;font-size:11.5px;color:var(--muted);min-width:0}
.terms>div:first-child{padding-left:0}
.terms>div+div{border-left:1px solid var(--rule)}
.terms .mono{display:block;font-size:13.5px;color:var(--ink);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--rule);margin:14px -16px 0;padding:12px 16px;min-height:52px;font-size:13.5px}
.dl>button{min-height:46px}
.dl>div,.dl>button{display:flex;width:100%;text-align:left;align-items:baseline;gap:6px;padding:10px 0;border-bottom:1px dashed var(--rule);font-size:13px;color:var(--muted);white-space:nowrap}
.dl .mono{color:var(--ink);font-size:13.5px}
.sch{table-layout:fixed}
.sch td,.sch th{padding-left:2px;padding-right:2px}
.sch td.mono{font-size:12px;word-spacing:-.4em;overflow:hidden}
.sch tr.paid td{color:var(--muted)}
.sch tr.paid .jt{text-decoration:line-through;text-decoration-thickness:1px}
.sch tr.next td{background:var(--sig);color:var(--sig-ink);border-bottom-color:transparent;font-weight:700}
.sch tr.next td:first-child{box-shadow:-6px 0 0 var(--sig)}
.sch tr.next td:last-child{box-shadow:6px 0 0 var(--sig)}
.sch tr.next.late td{background:var(--dng)}
.sch tr.next.late td:first-child{box-shadow:-6px 0 0 var(--dng)}
.sch tr.next.late td:last-child{box-shadow:6px 0 0 var(--dng)}
.sch tr.xtra td{color:var(--pos)}
.mini-stamp{display:inline-block;border:1.4px solid currentColor;border-radius:3px;padding:0 3px;font-family:var(--monocaps);font-size:9.5px;letter-spacing:.04em;color:var(--pos);transform:rotate(-5deg);text-transform:uppercase;word-spacing:-.2em}
.mini-stamp.d{color:var(--dng)}
/* ===================== SHEETS ===================== */
.layer{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.layer>.dim{position:absolute;inset:0;background:var(--dim);animation:fade .18s ease-out}
.sheetwrap{position:relative;width:100%;max-width:480px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet{position:relative;background:var(--paper2);max-height:calc(100vh - 28px - var(--sat));max-height:calc(100dvh - 28px - var(--sat));overflow:auto;overscroll-behavior:contain;padding:14px 22px calc(20px + var(--sab))}
.layer.center{justify-content:center;padding:20px}
.layer.center .sheetwrap{max-width:380px;animation:fade .15s}
.layer.center .sheet{box-shadow:var(--shadow);padding:22px 20px 20px;border:1px solid var(--rule)}
@keyframes up{from{transform:translateY(60px)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -10px 0 0}
.shead h3{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1}
.amtrow{display:flex;align-items:flex-end;justify-content:space-between;margin-top:16px}
.amt-big{white-space:nowrap;font-size:80px;line-height:1;padding-top:2px;letter-spacing:-.035em;display:flex;align-items:baseline;gap:8px;overflow:hidden;width:100%}
.amt-big .u{font-family:var(--serif);font-size:26px;font-style:italic;color:var(--muted);letter-spacing:0}
.amt-big .caret{width:2px;height:.72em;background:var(--sig);align-self:center;margin-left:-2px;animation:blink 1.1s steps(1) infinite}
.amt-big.empty>span:first-child{color:var(--muted)}
@keyframes blink{50%{opacity:0}}
.cur{display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;font-size:13px;font-weight:600;flex:none}
.cur button{padding:0 12px;min-height:34px;display:grid;place-items:center;color:var(--muted)}
.cur .on{background:var(--ink);color:var(--paper2)}
.hint{font-size:13.5px;color:var(--muted);margin-top:10px;min-height:19px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.cats>button{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;color:var(--ink2);padding:4px 2px;text-align:center;min-width:0;line-height:1.15;overflow-wrap:anywhere}
.cats>.on{background:var(--ink);color:var(--paper2);font-weight:600}
.cats.three{grid-template-columns:repeat(3,1fr)}
.fields{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px;margin-top:16px}
.fields.two{grid-template-columns:1fr 1fr}
.fields.four{grid-template-columns:1.1fr .95fr 1fr .9fr;gap:10px}
.fields.three{grid-template-columns:1fr 1.2fr .9fr;gap:10px}
.fields.four .v,.fields.three .v,.fields.four input,.fields.three input{font-size:14px}
.fld{border-bottom:1.5px dotted var(--rule);padding-bottom:6px;min-height:48px;display:block;text-align:left;width:100%;position:relative;min-width:0}
.fld .k{font-size:12px;color:var(--muted);display:block}
.fld .v{font-size:15px;font-weight:600;display:flex;align-items:center;gap:4px;margin-top:2px;white-space:nowrap;overflow:hidden}
.fld .v>span{overflow:hidden;text-overflow:ellipsis}
.fld .v.ph{color:var(--muted);font-weight:400;font-style:italic}
.fld input{border:0;background:none;outline:0;font-size:15px;font-weight:600;width:100%;padding:2px 0 0;min-height:24px}
.fld input::placeholder{color:var(--muted);font-weight:400;font-style:italic}
.fld input[type=date]{min-height:26px}
.fld .over{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.keys{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;user-select:none;-webkit-user-select:none}
.keys button{min-height:58px;display:grid;place-items:center;font-size:32px;border-bottom:1px solid var(--rule2);font-family:var(--serif);touch-action:manipulation}
.keys button:active{background:var(--sig-soft)}
.keys button:nth-child(3n+2){border-left:1px solid var(--rule2);border-right:1px solid var(--rule2)}
.keys button:nth-last-child(-n+3){border-bottom:0}
.save{margin-top:12px;min-height:58px;border-radius:6px;background:var(--sig);color:var(--sig-ink);display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:17px;font-weight:600;width:100%}
.save .mono{font-size:17px}
.save:disabled{opacity:.45}
/* forms */
.form{display:grid;gap:14px;margin-top:14px}
.f{display:block}
.f>.k{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.f input[type=text],.f input[type=date],.f input[type=number],.f input[type=tel],.f input:not([type]),.f textarea,.f select{width:100%;border:0;border-bottom:1.5px dotted var(--rule);background:none;padding:6px 0 7px;font-size:17px;outline:0;border-radius:0;min-height:40px}
.f textarea{font-family:var(--serif);font-style:italic;font-size:17px;resize:vertical;min-height:70px;line-height:1.5}
.f input:focus,.f textarea:focus{border-bottom-color:var(--sig);border-bottom-style:solid}
.f input.num{font-family:var(--mono);word-spacing:-.32em;font-size:19px}
.f .help{font-size:12px;color:var(--muted);margin-top:4px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.seg>button{flex:1;min-height:42px;font-size:14px;color:var(--ink2);padding:0 6px;text-align:center}
.seg>button+button{border-left:1px solid var(--ink)}
.seg>.on{background:var(--ink);color:var(--paper2);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);border-radius:999px;padding:0 13px;min-height:40px;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--paper2);font-weight:600}
.chip .mono{font-size:12.5px;opacity:.8}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;width:100%;font-size:15px}
.tog .sw{width:44px;height:26px;border-radius:13px;border:1.5px solid var(--ink);position:relative;flex:none}
.tog .sw:after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--ink);transition:transform .15s}
.tog.on .sw{background:var(--sig);border-color:var(--sig)}
.tog.on .sw:after{transform:translateX(18px);background:var(--sig-ink)}
.box{border:1px solid var(--rule);padding:12px 14px;font-size:14px;line-height:1.45}
.box.warn{border-color:var(--dng);color:var(--dng);background:var(--dng-soft)}
.box.info{border-color:var(--sig);background:var(--sig-soft)}
.copybox{width:100%;min-height:150px;border:1px solid var(--rule);background:var(--bg);padding:10px;font-family:var(--mono);font-size:12px;word-spacing:0;line-height:1.45;resize:vertical}
.list>button,.list>a,.list>div{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px dashed var(--rule);width:100%;padding:6px 0}
.list .grow{flex:1;min-width:0}
.list .t{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .s{font-size:12.5px;color:var(--muted)}
.iconpick{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.iconpick button{min-height:48px;display:grid;place-items:center;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.iconpick .on{background:var(--ink);color:var(--paper2)}
.searchbar{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--ink);margin-top:12px;padding:0 0 2px}
.searchbar input{flex:1;border:0;background:none;outline:0;font-size:16px;min-height:42px;min-width:0}
.empty{text-align:center;padding:10px 6px}
.empty .serif{font-size:22px;font-style:italic}
.empty p{color:var(--muted);font-size:14px;margin-top:6px}
/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--sab));z-index:80;width:calc(100% - 28px);max-width:440px;background:var(--ink);color:var(--bg);border-radius:6px;display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;min-height:50px;font-size:14.5px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);animation:up .2s}
.toast span{flex:1}
.toast button{color:var(--bg);font-weight:700;min-height:44px;padding:0 12px;text-decoration:underline;text-underline-offset:3px}
/* onboarding */
.ob-hero{padding:calc(40px + var(--sat)) 22px 0}
.ob-hero .disp{font-size:64px;line-height:.95;letter-spacing:-.03em}
.ob-hero p{color:var(--ink2);font-size:16px;margin-top:14px;line-height:1.5}
.accrow{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;padding:10px 0;border-bottom:1px dashed var(--rule)}
.accrow input{width:100%;border:0;border-bottom:1.5px dotted var(--rule);background:none;padding:6px 0;font-size:16px;outline:0;min-height:40px;border-radius:0}
.accrow input.num{font-family:var(--mono);word-spacing:-.32em}
.accrow .cur button{padding:0 9px;min-height:32px}
.steps{display:flex;gap:6px;margin-top:22px}
.steps i{height:3px;flex:1;background:var(--rule)}
.steps i.on{background:var(--sig)}
.svt{font-family:var(--mono);word-spacing:-.35em}
@media (max-height:740px){
  .amt-big{font-size:58px}.amtrow{margin-top:8px}.hint{margin-top:6px}
  .cats>button{min-height:52px;gap:2px}.fields{margin-top:10px;gap:10px}.fld{min-height:44px}
  .keys{margin-top:6px}.keys button{min-height:46px;font-size:27px}.save{min-height:52px;margin-top:8px}
}
html.short .amt-big{font-size:58px}
html.short .amtrow{margin-top:8px}
html.short .hint{margin-top:6px}
html.short .cats>button{min-height:52px;gap:2px}
html.short .fields{margin-top:10px;gap:10px}
html.short .fld{min-height:44px}
html.short .keys{margin-top:6px}
html.short .keys button{min-height:46px;font-size:27px}
html.short .save{min-height:52px;margin-top:8px}
@media (max-width:380px){ .cats>button{font-size:11.5px} .hero-n{font-size:72px} .terms .mono{font-size:12px;word-spacing:-.4em} .terms>div{padding-left:7px} .types{gap:18px} .types>a,.types>button{font-size:15px} }
@media (min-width:520px){ body{border-left:1px solid var(--rule2);border-right:1px solid var(--rule2)} }
.syncdot{position:fixed;top:calc(var(--sat) + 6px);right:max(8px,calc(50% - 232px));width:7px;height:7px;border-radius:50%;z-index:40;pointer-events:none;opacity:0;transition:opacity .3s}
.syncdot.saving{opacity:.9;background:var(--sig);animation:blink 1s steps(1) infinite}
.syncdot.error{opacity:1;background:var(--dng)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let _txMemo = { v: -1, list: [] };
function allTx() {
  if (_txMemo.v === VER) return _txMemo.list;

  for (const ym in S.months) for (const t of S.months[ym].tx) list.push(t);

/** Record a change: stamp docs, persist locally, queue cloud writes, re-render */

/* =====================================================================
   7. CLOUD SYNC — Telegram CloudStorage, chunked docs
   Layout per logical doc (settings, debts, loans, m-YYYY-MM):
     d_<doc>_meta  = {"v":1,"n":N,"hash":"<fnv>","ts":<_u>,"c":["<h1>",...]}
     d_<doc>_<h>   = ≤4000-char slice of the doc's compact JSON (content-addressed by hash)
   Write order: new chunks → manifest → remove stale chunks. A crash before the manifest
   leaves the previous manifest pointing at untouched chunks, so the old doc stays readable.
   ===================================================================== */

    const c = s.charCodeAt(end - 1);
    if (end < s.length && c >= 0xD800 && c <= 0xDBFF) end--; // never split a surrogate pair
    out.push(s.slice(i, end)); i = end;

}

    const t = setTimeout(() => { if (!done) { done = true; reject(Object.assign(new Error('timeout'), { code: 'timeout' })); } }, 12000);
    try {
      WA.CloudStorage[fn](...args, (err, val) => {

  async getMany(keys) { const out = {}; for (let i = 0; i < keys.length; i += 20) Object.assign(out, await csCall('getItems', keys.slice(i, i + 20))); return out; },

const Sync = {

  state: 'idle',      // idle | saving | error  (quiet indicator)
  remote: {},         // docId -> ts known in the cloud (persisted: deletions elsewhere can be detected)
  meta: {},           // docId -> last manifest seen/written
  W: {}, keyCount: 0, pulling: false,
  pending(id) { const w = this.W[id]; return !!(w && (w.timer || w.inflight || w.retryT)); },
  saveKnown() { try { localStorage.setItem(LS_KNOWN, JSON.stringify(this.remote)); } catch (e) { } },
  loadKnown() { try { this.remote = JSON.parse(localStorage.getItem(LS_KNOWN) || '{}') || {}; } catch (e) { this.remote = {}; } },
  setState(s) {
    this.state = s;
    const el = document.getElementById('syncdot'); if (!el) return;
    el.className = 'syncdot ' + s;
    el.title = s === 'saving' ? 'Saqlanmoqda…' : s === 'error' ? 'Bulutga yozib boʻlmadi — qayta urinamiz' : 'Saqlandi';
  },
  busy() { return Object.values(this.W).some(w => w.timer || w.inflight || w.retryT); },
  refreshState() { if (this.mode !== 'sync') return; if (Object.values(this.W).some(w => w.failed)) this.setState('error'); else this.setState(this.busy() ? 'saving' : 'idle'); },
  queue(id) {

  async flush(id) {

    w.inflight = true; this.refreshState();
    try {
      await this.writeDoc(id);
      w.failed = false; w.tries = 0;
    } catch (e) {

  async writeDoc(id) {

    try { const r = await CS.getMany([metaKey(id)]); cur = r[metaKey(id)] ? JSON.parse(r[metaKey(id)]) : null; } catch (e) { if (e && e.code === 'timeout') throw e; cur = null; }

      if (cur || id in this.remote) {
        const all = await CS.keys();

        if (mine.includes(metaKey(id))) await CS.remove([metaKey(id)]);
        await CS.remove(mine.filter(k => k !== metaKey(id)));

      return;
    }
    // someone else wrote a newer version → take theirs (newer wins)
    if (cur && (cur.ts || 0) > (data._u || 0)) { await this.applyRemote(id, cur); return; }
    const json = JSON.stringify(data), hash = fnv(json);
    if (cur && cur.hash === hash) { this.meta[id] = cur; this.remote[id] = cur.ts; this.saveKnown(); return; }
    const chunks = splitChunks(json), hs = chunks.map(fnv);

    const todo = [];
    hs.forEach((h, i) => { if (!have.has(h) && !todo.some(t => t.h === h)) todo.push({ h, v: chunks[i] }); });

    await CS.set(metaKey(id), JSON.stringify(meta));

  },
  /** fetch manifests and reconcile every doc by ts (newer wins) */
  async pull() {
    if (this.mode !== 'sync' && this.mode !== 'connecting') return;
    if (this.pulling) return; this.pulling = true;
    try {
      const keys = await CS.keys();
      this.keyCount = keys.length;
      const mk = keys.filter(k => /^d_[A-Za-z0-9-]+_meta$/.test(k));
      const raw = mk.length ? await CS.getMany(mk) : {};
      const remoteMeta = {};
      for (const k of mk) { try { const m = JSON.parse(raw[k]); if (m && Array.isArray(m.c)) remoteMeta[k.slice(2, -5)] = m; } catch (e) { } }
      this.mode = 'sync';
      let changed = false;
      for (const id of Object.keys(remoteMeta)) {
        if (!/^(settings|debts|loans|m-\d{4}-\d{2})$/.test(id) || this.pending(id)) continue;
        const m = remoteMeta[id], loc = getDoc(id), lts = loc ? (loc._u || 0) : -1;
        if (!loc || m.ts > lts) { if (await this.applyRemote(id, m, keys)) changed = true; }
        else if (lts > m.ts) { this.meta[id] = m; this.queue(id); }
        else { this.meta[id] = m; this.remote[id] = m.ts; }
      }
      for (const id of localDocIds()) {
        if (id in remoteMeta || this.pending(id)) continue;
        if (this.remote[id] != null) { removeDoc(id); delete this.remote[id]; changed = true; } // deleted on another device
        else this.queue(id); // never uploaded: migrate up
      }
      for (const id of Object.keys(this.remote)) if (!(id in remoteMeta) && !getDoc(id)) delete this.remote[id];
      this.saveKnown();
      if (changed) { normalizeState(); VER++; saveLocal(); materializeRecurring(); scheduleRender(); }
      if (this.keyCount > 600 && !this.busy()) this.gc(keys, remoteMeta);
    } catch (e) {

    } finally { this.pulling = false; this.refreshState(); scheduleRender(); }
  },
  /** remove chunks no manifest references (only when the key budget gets tight) */
  async gc(keys, remoteMeta) {
    const keep = new Set();
    for (const id in remoteMeta) { keep.add(metaKey(id)); for (const h of remoteMeta[id].c) keep.add(chunkKey(id, h)); }
    const orphan = keys.filter(k => k.startsWith('d_') && !keep.has(k));

  },
  countKeysSoon() {
    clearTimeout(this.kt);
    this.kt = setTimeout(async () => { try { const n = (await CS.keys()).length; if (n !== this.keyCount) { this.keyCount = n; if (route().name === 'sozlamalar') scheduleRender(); } } catch (e) { } }, 2500);
  },
  attach() {
    if (!IN_TG) { this.mode = 'outside'; scheduleRender(); return; }
    if (!tgv('6.9') || !WA.CloudStorage) { this.mode = 'local'; scheduleRender(); return; }

  async deleteAll() {

  },
};

/* =====================================================================
   8. MUTATIONS (domain operations)
   ===================================================================== */
const accById = id => S.settings.accounts.find(a => a.id === id);
const catById = id => S.settings.cats.find(c => c.id === id);
const accName = id => (accById(id) || {}).name || '—';
const catName = id => (catById(id) || {}).name || 'Boshqa';

const rateOr = r => r || S.settings.usdRate || 0;

function findTx(id) {
  for (const ym in S.months) { const t = S.months[ym].tx.find(x => x.id === id); if (t) return t; }
  return null;
}
/** insert (dedupe by id) */
function txInsert(tx) {
  const ym = ymOf(tx.date);
  const m = S.months[ym] || (S.months[ym] = { tx: [], _u: 0 });
  const i = m.tx.findIndex(x => x.id === tx.id);
  if (i >= 0) m.tx[i] = tx; else m.tx.push(tx);
  return docIdForMonth(ym);
}
function txRemove(id) {
  for (const ym in S.months) {
    const m = S.months[ym], i = m.tx.findIndex(x => x.id === id);
    if (i >= 0) { const [t] = m.tx.splice(i, 1); return { tx: t, doc: docIdForMonth(ym) }; }
  }
  return null;
}
function txNormalize(tx) {
  tx.amount = tx.currency === 'USD' ? Math.round(tx.amount * 100) / 100 : Math.round(tx.amount);
  if (tx.currency === 'USD') tx.rate = rateOr(tx.rate); else delete tx.rate;
  tx.uzs = calc.toUZS(tx.amount, tx.currency, tx.rate);
  return tx;
}
function saveTx(tx, oldId) {
  const docs = [];
  if (oldId) { const r = txRemove(oldId); if (r) docs.push(r.doc); }
  docs.push(txInsert(txNormalize(tx)));
  commit(docs);
}
function deleteTx(id) {
  const r = txRemove(id);
  if (!r) return null;
  commit([r.doc]);
  return r.tx;
}

/* recurring — materialise due occurrences idempotently (deterministic ids) */
function materializeRecurring() {
  if (!S.settings || !S.settings.onboarded) return;
  const t = today(), docs = [];
  let settingsChanged = false;
  for (const rec of S.settings.recurring) {
    if (rec.active === false) continue;
    const dates = calc.recurringDates(rec, t);
    for (const d of dates) {
      const id = calc.recTxId(rec.id, d);
      if (!findTx(id)) {
        docs.push(txInsert(txNormalize({
          id, type: rec.type, amount: rec.amount, currency: rec.currency, rate: rec.rate, catId: rec.catId || null,
          accId: rec.accId, toAccId: rec.toAccId || null, date: d, time: '', note: rec.note || '', recId: rec.id, createdAt: Date.now(),
        })));
      }
    }
    if (dates.length) { rec.lastDone = dates[dates.length - 1]; settingsChanged = true; }
  }
  if (settingsChanged) docs.push('settings');
  if (docs.length) commit(docs);
}

/* debts */
function ensurePerson(name, phone) {
  const n = normName(name);
  let p = S.debts.people.find(x => normName(x.name) === n);
  if (!p) { p = { id: newId('p'), name: name.trim().replace(/\s+/g, ' '), phone: phone || '' }; S.debts.people.push(p); }
  else if (phone && !p.phone) p.phone = phone;
  return p;
}
function addDebt(o) {
  const p = ensurePerson(o.person, o.phone);
  const d = {
    id: newId('d'), pid: p.id, dir: o.dir, amount: o.amount, currency: o.currency || 'UZS', rate: o.currency === 'USD' ? rateOr(o.rate) : undefined,
    date: o.date, due: o.due || null, note: o.note || '', accId: o.affectsBalance ? o.accId : null, affectsBalance: !!o.affectsBalance && !!o.accId, createdAt: Date.now(),
  };
  S.debts.debts.push(d);
  commit(['debts']);
  return d;
}
function updateDebt(id, patch) {
  const d = S.debts.debts.find(x => x.id === id); if (!d) return;
  Object.assign(d, patch);
  if (!d.affectsBalance) d.accId = null;
  commit(['debts']);
}
/** record repayment; if amount > remaining and allowOver, excess becomes a reverse debt */
function payDebt(debtId, amount, date, accId, note, allowOver) {
  const d = S.debts.debts.find(x => x.id === debtId); if (!d) return null;
  const rem = calc.debtRemaining(d, S.debts.payments);
  const applied = Math.min(amount, rem), excess = amount - applied;
  const out = { payments: [], debts: [] };
  if (applied > 0) {
    const p = { id: newId('q'), debtId, amount: applied, date, accId: d.affectsBalance ? accId : null, note: note || '', kind: 'pay', createdAt: Date.now() };
    S.debts.payments.push(p); out.payments.push(p.id);
  }
  if (excess > 0 && allowOver) {
    const rev = {
      id: newId('d'), pid: d.pid, dir: d.dir === 'given' ? 'taken' : 'given', amount: excess, currency: d.currency, rate: d.rate,
      date, due: null, note: 'Ortiqcha toʻlov', accId: d.affectsBalance ? accId : null, affectsBalance: d.affectsBalance && !!accId, createdAt: Date.now(),
    };
    S.debts.debts.push(rev); out.debts.push(rev.id);
  }
  commit(['debts']);
  return out;
}
function forgiveDebt(debtId, date) {
  const d = S.debts.debts.find(x => x.id === debtId); if (!d) return null;
  const rem = calc.debtRemaining(d, S.debts.payments); if (rem <= 0) return null;
  const p = { id: newId('q'), debtId, amount: rem, date, accId: null, note: '', kind: 'forgive', createdAt: Date.now() };
  S.debts.payments.push(p);
  commit(['debts']);

}
function snapshotDebts() { return clone(S.debts); }
function restoreDebts(snap) { const u = S.debts._u; S.debts = snap; S.debts._u = u; commit(['debts']); }

/* loans */
function addLoan(loan, prepaid) {
  S.loans.loans.push(loan);
  if (loan.type !== 'card') {
    const rows = calc.buildSchedule(loan);
    for (let i = 0; i < Math.min(prepaid || 0, rows.length); i++) { rows[i].paid = rows[i].total; rows[i].paidDate = rows[i].due; rows[i].pre = true; }
    S.loans.payments.push(...rows);
  }
  commit(['loans']);
}
function loanTx(loan, amount, accId, date, rowId) {
  const acc = accById(accId);
  const tx = txNormalize({
    id: newId('t'), type: 'exp', amount, currency: 'UZS', catId: 'credit', accId, date, time: date === today() ? nowHM() : '',
    note: loan.name, loanId: loan.id, loanPayId: rowId, createdAt: Date.now(),
  });
  void acc;
  return tx;
}
function payLoanRow(loanId, rowId, accId, date) {
  const loan = loanById(loanId), row = S.loans.payments.find(r => r.id === rowId);
  if (!loan || !row || row.paid) return;
  const tx = loanTx(loan, row.total, accId, date, row.id);
  row.paid = row.total; row.paidDate = date; row.txId = tx.id; row.accId = accId;
  const docs = ['loans', txInsert(tx)];
  updateLoanStatus(loan);
  commit(docs);
}
function undoLoanRow(rowId) {
  const row = S.loans.payments.find(r => r.id === rowId); if (!row || !row.paid) return;
  const docs = ['loans'];
  if (row.txId) { const r = txRemove(row.txId); if (r) docs.push(r.doc); }
  row.paid = 0; row.paidDate = null; row.txId = null; row.pre = false;
  const loan = loanById(row.loanId); if (loan) updateLoanStatus(loan);
  commit(docs);
}
function earlyRepay(loanId, X, mode, date, accId) {

  if (!res) return null;

  updateLoanStatus(loan);

}
function undoEarly(extraId) {

  const loan = loanById(ex.loanId);
  // remove regenerated unpaid rows of this loan that come after, restore previous rows
  S.loans.payments = S.loans.payments.filter(r => r.id !== extraId && !(r.loanId === ex.loanId && !r.extra && !r.paid));
  if (Array.isArray(ex.prev)) S.loans.payments.push(...ex.prev);

function canUndoEarly(ex) {

  for (const ym in S.months) {
    let ch = false;
    for (const t of S.months[ym].tx) if (t.loanId === loanId) { t.loanId = null; t.loanPayId = null; ch = true; }
    if (ch) docs.push(docIdForMonth(ym));
  }
  commit(docs);
  return snap;
}

function txSub(t, withDate) {
  const parts = [];
  if (t.type === 'tr') parts.push(t.note ? `${accName(t.accId)} → ${accName(t.toAccId)}` : 'Oʻtkazma');
  else { if (t.note) parts.push(catName(t.catId)); parts.push(accName(t.accId)); }
  let s = parts.join(' · ');
  if (withDate) s += ', ' + (withDate === 'rel' ? (dayHead(t.date) === 'Bugun' ? 'bugun' : dayHead(t.date) === 'Kecha' ? 'kecha' : dShort(t.date)) : dShort(t.date)) + (t.time ? ' ' + t.time : '');

function txAmt(t) {

/* budget ruler (home) */
function budgetRuler(segs, budget, spent) {
  const W = contentW(), H = 26, Y = 22, M = Math.max(budget, spent) || 1;
  let x = 0, g = '', qoldiAbove = '';
  for (const s of segs) {
    const w = s.amount / M * W; if (w <= 0) continue;
    g += `<rect x="${x.toFixed(1)}" y="${Y}" width="${Math.max(w - 1.5, .8).toFixed(1)}" height="${H}" fill="${s.fill}"/>`;
    x += w;
  }
  const sx = Math.min(x, W);
  if (budget > 0 && spent < budget) {
    const rw = W - sx;
    g += `<rect x="${(sx + .75).toFixed(1)}" y="${Y + .75}" width="${Math.max(rw - 1.5, 0).toFixed(1)}" height="${H - 1.5}" style="fill:var(--sig-soft);stroke:var(--sig)" stroke-width="1.5"/>`;
    const txt = `${compact(budget - spent)} qoldi`;
    if (rw > txt.length * 7.8 + 10) g += `<text class="svt" x="${(sx + rw / 2).toFixed(1)}" y="${Y + 17.5}" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--sig)">${esc(txt)}</text>`;
    else if (rw > compact(budget - spent).length * 7.8 + 10) g += `<text class="svt" x="${(sx + rw / 2).toFixed(1)}" y="${Y + 17.5}" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--sig)">${esc(compact(budget - spent))}</text>`;
    else if (sx > W * 0.5) qoldiAbove = txt;
  }
  if (budget > 0 && spent > budget) {
    const bx = budget / M * W;
    g += `<path d="M${bx.toFixed(1)} ${Y - 4}V${Y + H + 3}" style="stroke:var(--dng)" stroke-width="2" stroke-dasharray="3 2"/>`;
  }
  const lbl = `${compact(spent)} sarflandi`;
  const left = sx > W * 0.5;
  if (qoldiAbove && sx + 8 + qoldiAbove.length * 7.6 <= W) g += `<text class="svt" x="${(sx + 6).toFixed(1)}" y="${Y - 9}" text-anchor="start" font-size="12.5" font-weight="700" style="fill:var(--sig)">${esc(qoldiAbove)}</text>`;
  g += `<path d="M${Math.max(sx, .75).toFixed(1)} ${Y - 7}V${Y + H + 3}" style="stroke:var(--ink)" stroke-width="1.5"/>`;
  g += `<text class="svt" x="${(left ? sx - 4 : sx + 4).toFixed(1)}" y="${Y - 9}" text-anchor="${left ? 'end' : 'start'}" font-size="12.5" style="fill:var(--ink)">${esc(lbl)}</text>`;
  const mln = M >= 1e6;
  for (let i = 0; i <= 18; i++) {
    const tx = Math.min(Math.max(i / 18 * W, .75), W - .75);
    g += `<path d="M${tx.toFixed(1)} ${Y + H + 4}v${i % 2 === 0 ? 8 : 4}" style="stroke:var(--ink2)" stroke-width="1"/>`;
    if (i % 6 === 0) {
      const v = M * i / 18;
      const s = i === 0 ? '0' : mln ? String(Math.round(v / 1e5) / 10).replace('.', ',') : String(Math.round(v / 1e3));
      g += `<text class="svt" x="${(i / 18 * W).toFixed(1)}" y="${Y + H + 25}" text-anchor="${i === 0 ? 'start' : i === 18 ? 'end' : 'middle'}" font-size="12" style="fill:var(--muted)">${s}${i === 18 ? (mln ? ' mln' : ' ming') : ''}</text>`;
    }
  }
  return raw(`<svg width="${W}" height="${Y + H + 30}" viewBox="0 0 ${W} ${Y + H + 30}" style="margin-top:16px;overflow:visible" role="img" aria-label="Byudjet: ${esc(lbl)}">${g}</svg>`);
}
function progressRuler(frac, labelIn, labelOut) {
  const W = contentW(), H = 22, Y = 4, x = Math.max(0, Math.min(1, frac)) * W;
  let t = '';
  for (let i = 0; i <= 20; i++) { const tx = Math.min(Math.max(i / 20 * W, .75), W - .75); t += `<path d="M${tx.toFixed(1)} ${Y + H + 4}v${i % 10 === 0 ? 9 : i % 5 === 0 ? 6 : 3}" style="stroke:var(--ink2)"/>`; }
  let g = '';
  if (x > 1) g += `<rect x="0" y="${Y}" width="${Math.max(x - 1, 0).toFixed(1)}" height="${H}" style="fill:var(--ink)"/>`;
  if (W - x > 1) g += `<rect x="${(x + .75).toFixed(1)}" y="${Y + .75}" width="${Math.max(W - x - 1.5, 0).toFixed(1)}" height="${H - 1.5}" style="fill:var(--sig-soft);stroke:var(--sig)" stroke-width="1.5"/>`;
  if (W - x > labelOut.length * 7.6 + 8) g += `<text class="svt" x="${((x + W) / 2).toFixed(1)}" y="${Y + 15.5}" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--sig)">${esc(labelOut)}</text>`;
  if (x > labelIn.length * 7.6 + 8) g += `<text class="svt" x="${(x / 2).toFixed(1)}" y="${Y + 15.5}" text-anchor="middle" font-size="12.5" style="fill:var(--bg)">${esc(labelIn)}</text>`;
  return raw(`<svg width="${W}" height="${Y + H + 14}" style="margin-top:18px;display:block">${g}${t}</svg>`);
}
function payRuler(n, paid, W, nextLate) {
  if (n > 60) return contBar(paid / n, W);
  const gap = n > 36 ? 1 : 2, w = (W - gap * (n - 1)) / n; let r = '';
  for (let i = 0; i < n; i++) {
    const x = i * (w + gap);
    if (i < paid) r += `<rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="16" style="fill:var(--ink)"/>`;
    else if (i === paid) r += `<rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="16" style="fill:var(${nextLate ? '--dng' : '--sig'})"/>`;
    else r += `<rect x="${(x + .5).toFixed(2)}" y=".5" width="${Math.max(w - 1, .5).toFixed(2)}" height="15" fill="none" style="stroke:var(--rule)" stroke-width="1"/>`;
  }
  return raw(`<svg width="${W}" height="16" style="margin-top:12px">${r}</svg>`);
}
function contBar(frac, W) {
  let t = '';
  for (let i = 0; i <= 10; i++) { const x = Math.min(Math.max(i / 10 * W, .5), W - .5); t += `<path d="M${x.toFixed(1)} 18v${i % 5 ? 4 : 7}" style="stroke:var(--ink2)"/>`; }
  return raw(`<svg width="${W}" height="26" style="margin-top:12px"><rect x=".5" y=".5" width="${W - 1}" height="15" fill="none" style="stroke:var(--rule)"/><rect x="0" y="0" width="${(W * Math.max(0, Math.min(1, frac))).toFixed(1)}" height="16" fill="url(#p-hatch)"/>${t}</svg>`);
}

/* =====================================================================
   10. ALERTS (home "Eslatmalar")
   ===================================================================== */
function buildAlerts() {
  const t = today(), out = [], pays = S.debts.payments;
  for (const d of S.debts.debts) {
    if (!d.due) continue;
    const rem = calc.debtRemaining(d, pays); if (rem <= 0) continue;
    const rd = relDays(d.due, t);
    if (!rd.late && rd.k > 3) continue;
    const p = personById(d.pid); if (!p) continue;
    out.push({
      href: '#qarz-' + p.id, title: p.name, amount: money(rem, d.currency), late: rd.late, k: rd.k,
      sub: (d.dir === 'given' ? (rd.late ? 'Qaytarishi kerak edi: ' : 'Qaytarish muddati: ') : (rd.late ? 'Qaytarishim kerak edi: ' : 'Men qaytarishim kerak: ')) + dMid(d.due),
      stamp: rd.text,
    });
  }
  for (const l of S.loans.loans) {
    if (l.type === 'card') {
      const cs = calc.cardSummary(l, S.loans.payments, t);
      if (!cs.due) continue;
      const rd = relDays(cs.nextDue, t);
      if (rd.k > 7) continue;
      out.push({ href: '#kredit-' + l.id, title: l.name, sub: 'Minimal toʻlov: ' + dMid(cs.nextDue), amount: fmt(cs.minPay - cs.paidCycle), late: false, k: rd.k, stamp: rd.text });
      continue;
    }
    const s = calc.loanSummary(l, S.loans.payments, t);
    if (s.closed) continue;
    if (s.overdue.length) {
      const first = s.overdue[0], rd = relDays(first.due, t);
      out.push({ href: '#kredit-' + l.id, title: l.name, sub: (s.overdue.length > 1 ? `${s.overdue.length} ta toʻlov oʻtib ketdi, ` : 'Kredit toʻlovi: ') + dMid(first.due), amount: fmt(sum(s.overdue, 'total')), late: true, k: rd.k, stamp: rd.text });
    } else if (s.next) {
      const rd = relDays(s.next.due, t);
      if (rd.k <= 7) out.push({ href: '#kredit-' + l.id, title: l.name, sub: 'Kredit toʻlovi: ' + dMid(s.next.due), amount: fmt(s.next.total), late: false, k: rd.k, stamp: rd.text });
    }
  }
  // category limits exceeded this month
  const st = calc.monthStats(allTx(), ymOf(t));
  for (const c of S.settings.cats) {
    if (c.type !== 'exp' || !c.limit) continue;
    const sp = st.byCat[c.id] || 0;
    if (sp > c.limit) out.push({ href: '#sozlamalar', title: c.name + ' limiti', sub: `Limit ${fmt(c.limit)}, sarflandi ${fmt(sp)}`, amount: '+' + fmt(sp - c.limit), late: true, k: 0, stamp: 'Oshdi' });
  }
  out.sort((a, b) => (b.late - a.late) || (a.k - b.k));
  return out;
}

function historyItems(ymOrAll) {

  if ((f.type === 'all' || f.type === 'debt') && !f.cat) {

  items = items.filter(t => matchesQuery(t, q));

  const th = calc.heatThresholds(S.settings.budget, ym, tot);

  const off = (parseD(ym + '-01').getDay() + 6) % 7;
  const n = daysInMonth(y, m);
  let sel = UI.calDay && UI.calDay.startsWith(ym) ? UI.calDay : (t.startsWith(ym) ? t : null);
  const cells = [];

  for (let d = 1; d <= n; d++) {

  }

/* ---------- Qarz detail (per person) ---------- */
function personLedger(pid) {
  const debts = S.debts.debts.filter(d => d.pid === pid), ids = new Set(debts.map(d => d.id));
  const pays = S.debts.payments.filter(p => ids.has(p.debtId));
  const rows = [];
  for (const d of debts) rows.push({ kind: 'debt', id: d.id, date: d.date, ca: d.createdAt || 0, d, amount: d.amount, currency: d.currency });
  for (const p of pays) { const d = debts.find(x => x.id === p.debtId); rows.push({ kind: p.kind === 'forgive' ? 'forgive' : 'pay', id: p.id, date: p.date, ca: p.createdAt || 0, d, p, amount: p.amount, currency: d.currency }); }
  rows.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.ca - b.ca);
  let run = 0;
  const rate = S.settings.usdRate;
  for (const r of rows) {
    const uz = calc.toUZS(r.amount, r.currency, r.currency === 'USD' ? (rate || r.d.rate) : 1);
    const sgn = r.d.dir === 'given' ? 1 : -1;
    run += r.kind === 'debt' ? sgn * uz : -sgn * uz;
    r.run = run;
  }
  return { debts, pays, rows };
}
function viewQarz(pid) {

  const sm = ds.people[pid];
  const { debts, rows } = personLedger(pid);
  const pays = S.debts.payments;
  const net = sm.net;
  const openGiven = sm.open.filter(d => d.dir === 'given'), openTaken = sm.open.filter(d => d.dir === 'taken');
  const dirs = new Set(debts.map(d => d.dir));
  const mixed = dirs.size > 1, onlyTaken = dirs.has('taken') && !dirs.has('given');
  const firstDebt = debts.slice().sort((a, b) => a.date < b.date ? -1 : 1)[0];
  // progress over the open debts in dominant direction
  const dom = net >= 0 ? openGiven : openTaken;
  const tot = sum(dom, 'amount'), back = sum(dom, d => calc.debtPaid(d, pays));
  const due = dom.filter(d => d.due).map(d => d.due).sort()[0];
  const rd = due ? relDays(due) : null;
  const label = net > 0 ? 'Sizga qaytarishi kerak' : net < 0 ? 'Siz qaytarishingiz kerak' : 'Hisob-kitob yopilgan';
  const c3 = mixed ? 'Qarz' : onlyTaken ? 'Oldim' : 'Berildi', c4 = mixed ? 'Toʻlov' : onlyTaken ? 'Qaytardim' : 'Qaytdi';
  const dash = html`<span style="color:var(--muted)">–</span>`;
  const tr = rows.map(r => {
    const name = r.kind === 'debt' ? (r.d.dir === 'given' ? 'Qarz berdim' : 'Qarz oldim') : r.kind === 'forgive' ? 'Kechirildi' : r.d.dir === 'given' ? 'Qaytardi' : 'Qaytardim';

    return html`<tr data-act="ledgerRow" data-kind="${r.kind}" data-id="${r.id}"><td class="mono">${dShort(r.date)}</td><td class="wrapc">${name}<span class="sub">${sub}</span></td><td class="r mono">${c3v || dash}</td><td class="r mono ${r.kind === 'pay' ? 'pos' : ''}">${c4v || dash}</td><td class="r mono">${mixed && r.run < 0 ? MINUS : ''}${fmt(r.run)}</td></tr>`;

  const totBack = sum(rows.filter(r => r.kind !== 'debt'), r => calc.toUZS(r.amount, r.currency, r.currency === 'USD' ? S.settings.usdRate || r.d.rate : 1));

    <section style="margin-top:24px">

      <div class="big2 disp" data-fit><span>${fmt(net)}</span><span class="u">soʻm</span></div>

      ${tot ? progressRuler(back / tot, `${compact(back)} qaytdi`, `${compact(tot - back)} qoldi`) : ''}
      ${tot ? html`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px" class="mono"><span>0</span><span>${fmt(tot)}</span></div>` : ''}

        <tfoot><tr><td colspan="2">Jami</td><td class="r mono">${fmt(totDebt)}</td><td class="r mono pos">${fmt(totBack)}</td><td class="r mono">${net < 0 && mixed ? MINUS : ''}${fmt(net)}</td></tr></tfoot>
      </table>

    </section>

    <div style="margin-top:30px;display:grid;gap:10px">
      ${openGiven.length ? html`<button class="btn pri" data-act="debtPay" data-dir="given">${ic('plus', 20, 2)}Qaytgan pulni yozish</button>` : ''}

    </div>

      ${openGiven.length ? html`<button class="btn ghost" data-act="remind">${ic('bell', 19, 1.6)}Eslatish</button>` : ''}

const SCHEME_NAME = { annuity: 'Annuitet', diff: 'Differensial', flat: 'Flat' };
const TYPE_NAME = { bank: 'bank krediti', installment: 'nasiya', card: 'kredit karta' };
function loanCard(l) {

    return html`<a class="contract" href="#kredit-${l.id}"><div class="in">
      <div class="ctop"><div><div class="serif">${l.name}</div><div class="lbl" style="font-size:13px;margin-top:2px">${l.lender ? l.lender + ', ' : ''}kredit karta</div></div><span style="color:var(--muted);padding-top:4px">${ic('chevR', 20)}</span></div>
      <div class="terms"><div>Limit<span class="mono">${compact(cs.limit)}</span></div><div>Imtiyoz<span class="mono">${l.grace ? l.grace + ' kun' : '—'}</span></div><div>Foiz<span class="mono">${l.rate || 0}%</span></div></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:14px"><span class="lbl">Ishlatilgan</span><span class="mono" style="font-size:22px">${fmt(cs.used)}</span></div>
      ${contBar(cs.frac, W)}
      <div style="display:flex;justify-content:space-between;margin-top:7px;font-size:12.5px;color:var(--muted)"><span>Limit ${fmt(cs.limit)}</span><span class="mono" style="word-spacing:-.25em">Mavjud ${fmt(cs.avail)}</span></div>
      <div class="cfoot"><span><span class="lbl" style="font-size:13.5px">Minimal toʻlov:</span> <b style="font-weight:600">${dMid(cs.nextDue)}</b>${cs.due && rd.k <= 7 ? html` ${stamp('s', rd.text, 'margin:0 0 0 4px;font-size:10.5px')}` : ''}</span><span class="mono" style="font-size:16px;font-weight:700">${cs.due ? fmt(cs.minPay - cs.paidCycle) : cs.used ? 'toʻlandi' : '0'}</span></div>
    </div></a>`;
  }
  const s = calc.loanSummary(l, S.loans.payments);
  const flat = l.scheme === 'flat';
  const terms = flat
    ? [['Sxema', 'Flat'], ['Ustama', l.principal && l.principal < l.total ? Math.round((l.total / l.principal - 1) * 100) + '%' : '—'], ['Muddat', l.term + ' oy']]
    : [['Sxema', SCHEME_NAME[l.scheme]], ['Foiz', l.rate + '% yillik'], ['Muddat', l.term + ' oy']];
  const late = s.overdue.length > 0;
  const rd = s.next ? relDays(s.next.due) : null;
  return html`<a class="contract" href="#kredit-${l.id}"><div class="in">
    <div class="ctop"><div><div class="serif">${l.name}</div><div class="lbl" style="font-size:13px;margin-top:2px">${l.lender ? l.lender + ', ' : ''}${TYPE_NAME[l.type]}</div></div><span style="color:var(--muted);padding-top:4px">${ic('chevR', 20)}</span></div>
    <div class="terms">${terms.map(([k, v]) => html`<div>${k}<span class="mono">${v}</span></div>`)}</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:14px"><span class="lbl">Qolgan qarz</span><span class="mono" style="font-size:22px">${fmt(s.remaining)}</span></div>
    ${payRuler(s.count, s.paidCount, W, late)}
    <div style="display:flex;justify-content:space-between;margin-top:7px;font-size:12.5px;color:var(--muted)"><span>${s.paidCount} / ${s.count} toʻlangan</span><span class="mono" style="word-spacing:-.25em">${flat ? 'Jami narx ' + fmt(l.total) : Math.round(s.paidCount / (s.count || 1) * 100) + '%'}</span></div>
    ${s.closed ? html`<div class="cfoot"><span class="lbl">Kredit yopilgan</span>${stamp('p', 'Yopildi', 'margin:0')}</div>`
      : html`<div class="cfoot"><span><span class="lbl" style="font-size:13.5px">Keyingi:</span> <b style="font-weight:600">${dMid(s.next.due)}</b>${rd.k <= 7 ? html` ${stamp(rd.late ? 'd' : 's', rd.late ? rd.text : rd.k === 0 ? 'bugun' : rd.k + ' kun', 'margin:0 0 0 4px;font-size:10.5px')}` : ''}</span><span class="mono" style="font-size:16px;font-weight:700">${fmt(late ? sum(s.overdue, 'total') : s.next.total)}</span></div>`}
  </div></a>`;
}
function viewKreditlar() {
  const loans = S.loans.loans;
  let total = 0, monthly = 0, nextDue = null;
  const active = [], closed = [];
  for (const l of loans) {
    if (l.type === 'card') {
      const cs = calc.cardSummary(l, S.loans.payments);
      total += cs.used; if (cs.due) { monthly += cs.minPay - cs.paidCycle; if (!nextDue || cs.nextDue < nextDue) nextDue = cs.nextDue; }
      active.push(l); continue;
    }
    const s = calc.loanSummary(l, S.loans.payments);
    if (s.closed) { closed.push(l); continue; }
    active.push(l);
    total += s.remaining; monthly += s.payment;
    if (!nextDue || s.next.due < nextDue) nextDue = s.next.due;
  }
  return html`${mastList('Kreditlar')}<div class="wrap">
    <section style="margin-top:22px">
      <div class="lbl">Jami qolgan qarz</div>
      <div class="big2 disp" style="font-size:60px" data-fit><span>${fmt(total)}</span><span class="u">soʻm</span></div>
      <div class="split">
        <div><div class="lbl">Oylik toʻlov jami</div><div class="mono" style="font-size:20px;margin-top:2px">${fmt(monthly)}</div></div>
        <div><div class="lbl">Keyingi toʻlov</div><div class="${nextDue && nextDue < today() ? 'dng' : ''}" style="font-size:17px;font-weight:600;margin-top:3px;white-space:nowrap">${nextDue ? dMid(nextDue) : '—'}</div></div>
      </div>
    </section>
    ${active.length ? active.map(loanCard) : html`<div class="receipt strip" style="margin-top:26px">${edge('top')}<div class="empty"><div class="serif">Kredit yoʻq</div><p>Bank krediti, nasiya yoki kredit kartani qoʻshing — toʻlov jadvali avtomatik tuziladi.</p></div>${edge('bot')}</div>`}
    <button class="btn ${active.length ? 'ghost' : 'pri'}" data-act="addLoan" style="margin-top:22px">${ic('plus', 20, 2)}Kredit qoʻshish</button>
    ${closed.length ? html`<button class="linkrow" data-act="toggleClosedLoans" style="margin-top:12px">${ic('archive', 20, 1.5)}<span style="flex:1;text-align:left">Yopilgan kreditlar (${closed.length})</span>${ic(UI.showClosedLoans ? 'chevD' : 'chevR', 18)}</button>${UI.showClosedLoans ? closed.map(loanCard) : ''}` : ''}
  </div>`;
}

  const dlRows = flat

    : [['Asosiy summa', fmt(l.principal)], ['Foiz', l.rate + '% yillik'], ['Muddat', l.term + ' oy'], ['Boshlangan', dShort(l.issued, true)], ['Oylik toʻlov', fmt(s.payment || 0), true]];
  return html`${mastDetail(l.name, 'kreditlar', 'loanMenu')}

   12. COMPONENTS — layers (sheets/dialogs), toast, fit-text
   ===================================================================== */
const layers = [];
function openLayer({ render, ctx = {}, center = false, onInput, onKey, onClose, label = '' }) {
  const el = document.createElement('div');
  el.className = 'layer' + (center ? ' center' : '');
  el.innerHTML = `<div class="dim"></div><div class="sheetwrap">${center ? '' : edge('top').s}<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"></div></div>`;
  $('#layers').appendChild(el);
  const L = {
    el, ctx, render, onInput, onKey, onClose, closed: false,
    sheet: el.querySelector('.sheet'),
    rerender() { const st = this.sheet.scrollTop; this.sheet.innerHTML = render(ctx, L).s; this.sheet.scrollTop = st; fitAll(this.sheet); },
    part(sel, content) { const n = this.sheet.querySelector(sel); if (n) { n.innerHTML = sv(content); fitAll(n.parentElement || n); } },
    close() {
      if (this.closed) return; this.closed = true;
      el.remove(); const i = layers.indexOf(L); if (i >= 0) layers.splice(i, 1);
      if (!layers.length) document.body.classList.remove('lock');
      if (onClose) onClose(L);
      tgBackSync(); tgDirtySync();
    },
  };
  el.querySelector('.dim').addEventListener('click', () => L.close());
  layers.push(L);
  document.body.classList.add('lock');
  tgBackSync();
  L.rerender();
  return L;
}
const topLayer = () => layers[layers.length - 1];
function closeAllLayers() { while (layers.length) layers[layers.length - 1].close(); }
const sheetHead = (title, sub) => html`<div class="shead"><div style="min-width:0"><h3>${title}</h3>${sub ? html`<div class="lbl" style="font-size:13px;margin-top:2px">${sub}</div>` : ''}</div><button class="ibtn" data-act="close" aria-label="Yopish">${ic('x', 22)}</button></div>`;

let toastTimer;
function warn(msg) { hap('error'); toast(msg); }
function toast(msg, undo) {
  const old = $('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = html`<span>${msg}</span>${undo ? html`<button type="button">Bekor qilish</button>` : ''}`.s;
  document.body.appendChild(el);
  if (undo) el.querySelector('button').addEventListener('click', () => { el.remove(); undo(); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), undo ? 6500 : 2800);
}
function confirmDlg({ title, text, ok = 'Ha', danger = false, typed = null }) {
  if (!typed && tgv('6.2') && WA.showConfirm) {
    return new Promise(resolve => { try { if (danger) hap('warning'); WA.showConfirm(`${title}\n\n${text}`.slice(0, 250), v => resolve(!!v)); } catch (e) { resolve(false); } });
  }
  return new Promise(resolve => {
    let done = false;
    const fin = v => { if (!done) { done = true; resolve(v); } };
    openLayer({
      center: true, label: title, ctx: { v: '', typed, fin },
      render: c => html`<h3 class="serif" style="font-size:23px;line-height:1.15">${title}</h3>
        <p style="margin-top:10px;font-size:14.5px;color:var(--ink2);line-height:1.5">${text}</p>
        ${typed ? html`<label class="f" style="margin-top:14px"><span class="k">Tasdiqlash uchun <b>${typed}</b> deb yozing</span><input type="text" data-k="v" autocomplete="off" autocapitalize="characters"></label>` : ''}
        <div class="btn2" style="margin-top:20px"><button class="btn ghost sm" data-act="dlgNo">Bekor</button><button class="btn sm ${danger ? 'dngfill' : 'pri'}" data-act="dlgYes" id="dlgYes" ${typed ? raw('aria-disabled="true"') : ''}>${ok}</button></div>`,
      onInput: (k, el, L) => { const b = L.sheet.querySelector('#dlgYes'); b.setAttribute('aria-disabled', String(!typedOk(L.ctx.v, typed))); },
      onClose: () => fin(false),
    });
  });
}
const typedOk = (v, typed) => !typed || normApos(v).toUpperCase().replace(/[^A-Z]/g, '') === normApos(typed).toUpperCase().replace(/[^A-Z]/g, '');

function fitEl(el) {
  el.style.fontSize = '';
  let fs = parseFloat(getComputedStyle(el).fontSize), g = 0;
  while (el.scrollWidth > el.clientWidth + 1 && fs > 22 && g++ < 40) { fs -= 2; el.style.fontSize = fs + 'px'; }
}
function fitAll(root) { $$('[data-fit]', root).forEach(fitEl); }

async function copyText(text, ta) {
  try { await navigator.clipboard.writeText(text); toast('Nusxa olindi'); }
  catch (e) {
    try { if (ta) { ta.focus(); ta.select(); } const ok = document.execCommand && document.execCommand('copy'); toast(ok ? 'Nusxa olindi' : 'Matnni belgilab, nusxa oling'); }
    catch (e2) { toast('Matnni belgilab, nusxa oling'); }
  }
}

function catUsage() {
  const since = addDays(today(), -90), u = {};
  for (const t of allTx()) if (t.date >= since && t.catId) u[t.catId] = (u[t.catId] || 0) + 1;
  return u;
}
function pickCats(type) {
  const u = catUsage();
  return S.settings.cats.filter(c => c.type === type && !c.system).map((c, i) => ({ c, i, n: u[c.id] || 0 }))
    .sort((a, b) => (b.n - a.n) || (a.i - b.i)).map(x => x.c);
}
const activeAccs = () => S.settings.accounts.filter(a => !a.archived);
function defaultAcc() { const a = accById(UIP.lastAcc); return a && !a.archived ? a.id : (activeAccs()[0] || {}).id; }

function openAdd(opts = {}) {

  const type = opts.type || 'exp';

    mode: 'add', type, digits: '', cur: acc.currency || 'UZS', catId: cats.some(c => c.id === last) ? last : (cats[0] || {}).id,
    accId, toAccId: (activeAccs().find(a => a.id !== accId) || {}).id || null, date: opts.date || today(), note: '', rec: 'none',
    rate: S.settings.usdRate ? grp(S.settings.usdRate) : '',
  };
  return openTxSheet(AF);
}

  };

function afNeedsRate(AF) {
  if (AF.type === 'tr') { const a = accById(AF.accId), b = accById(AF.toAccId); return !!(a && b && a.currency !== b.currency); }
  return AF.cur === 'USD' || (accById(AF.accId) || {}).currency !== AF.cur;
}
function afValid(AF) {
  const amt = parseInt(AF.digits || '0', 10);

  if (!AF.accId || !AF.date) return false;
  if (AF.type === 'tr' && (!AF.toAccId || AF.toAccId === AF.accId)) return false;
  if (AF.type !== 'tr' && !AF.catId) return false;

function afHint(AF) {
  const amt = parseInt(AF.digits || '0', 10), cur = AF.type === 'tr' ? (accById(AF.accId) || {}).currency : AF.cur;
  const rate = parseNum(AF.rate) || S.settings.usdRate;

    const c = catById(AF.catId), ym = ymOf(AF.date);
    const st = calc.monthStats(allTx().filter(t => t.id !== AF.id), ym);

    if (S.settings.budget && ym === ymOf(today())) {

    onKey: (e, L) => {
      const tg = e.target, typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA');
      if (e.key === 'Enter' && !typing) { e.preventDefault(); ACT.afSave(null, L); return; }
      if (typing) return;
      if (/^\d$/.test(e.key)) { e.preventDefault(); keyPress(L, e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); keyPress(L, 'bk'); }
    },
  });

function keyPress(L, k) {
  const AF = L.ctx;
  if (!L.dirty) { L.dirty = true; tgDirtySync(); }
  if (k === 'bk') AF.digits = AF.digits.slice(0, -1);
  else if (k === '000') { if (AF.digits) AF.digits = (AF.digits + '000').slice(0, 12); }
  else if (!(k === '0' && !AF.digits)) AF.digits = (AF.digits + k).slice(0, 12);
  afRefresh(L);
}

function reminderText(pid) {
  const p = personById(pid), ds = calc.debtSummary(S.debts, S.settings.usdRate).people[pid];

function loanPreview(c) {
  const term = parseNum(c.term), issued = c.issued || today(), payDay = Math.min(31, Math.max(1, parseNum(c.payDay) || parseD(issued).getDate()));
  const firstDue = addMonths(issued, 1, payDay);

    const P = parseNum(c.principal), r = parseFloatUz(c.rate);
    if (!P || !term) return html`<span class="lbl">Summa, foiz va muddatni kiriting — oylik toʻlov shu yerda chiqadi.</span>`;
    const rows = calc.genRows({ scheme: c.scheme, balance: P, rate: r, n: term, firstDue, payDay });
    const tot = sum(rows, 'total');
    return html`<div class="dl">
      <div>${c.scheme === 'diff' ? 'Birinchi toʻlov' : 'Oylik toʻlov'}<span class="lead"></span><span class="mono" style="font-weight:700;font-size:15px">${fmt(rows[0].total)}</span></div>
      ${c.scheme === 'diff' ? html`<div>Oxirgi toʻlov<span class="lead"></span><span class="mono">${fmt(rows[rows.length - 1].total)}</span></div>` : ''}
      <div>Jami toʻlanadi<span class="lead"></span><span class="mono">${fmt(tot)}</span></div>
      <div>Shundan foiz<span class="lead"></span><span class="mono">${fmt(tot - P)}</span></div>
      <div>Birinchi toʻlov sanasi<span class="lead"></span><span class="mono">${dShort(firstDue, true)}</span></div></div>`;
  }
  if (c.type === 'installment') {
    const T = parseNum(c.total), P = parseNum(c.principal);
    if (!T || !term) return html`<span class="lbl">Ustama bilan jami narx va muddatni kiriting.</span>`;
    return html`<div class="dl">
      <div>Oylik toʻlov<span class="lead"></span><span class="mono" style="font-weight:700;font-size:15px">${fmt(Math.round(T / term))}</span></div>
      ${P && P <= T ? html`<div>Ustama<span class="lead"></span><span class="mono">${fmt(T - P)} · ${Math.round((T / P - 1) * 100)}%</span></div>` : ''}
      <div>Birinchi toʻlov sanasi<span class="lead"></span><span class="mono">${dShort(firstDue, true)}</span></div></div>
      ${P > T ? html`<div class="box warn" style="margin-top:8px">Tovar narxi jami narxdan katta boʻlishi mumkin emas.</div>` : ''}`;
  }
  const lim = parseNum(c.limit), used = parseNum(c.used);
  return lim ? html`<div class="dl"><div>Mavjud<span class="lead"></span><span class="mono">${fmt(Math.max(0, lim - used))}</span></div><div>Minimal toʻlov<span class="lead"></span><span class="mono">${fmt(used ? Math.min(used, Math.ceil(used * (parseFloatUz(c.minPct) || 10) / 100 / 1000) * 1000) : 0)}</span></div></div>` : html`<span class="lbl">Limit va ishlatilgan summani kiriting.</span>`;
}

function buildCsv() {
  const rows = [['Sana', 'Vaqt', 'Tur', 'Summa', 'Valyuta', 'Kurs', 'Summa (UZS)', 'Kategoriya', 'Hisob', 'Hisobga', 'Izoh']];
  const TN = { exp: 'Chiqim', inc: 'Kirim', tr: 'Oʻtkazma' };
  for (const t of allTx().slice().reverse()) rows.push([t.date, t.time || '', TN[t.type], t.amount, t.currency, t.rate || '', t.uzs, t.type === 'tr' ? '' : catName(t.catId), accName(t.accId), t.toAccId ? accName(t.toAccId) : '', t.note || '']);
  for (const e of debtEvents(() => true).sort((a, b) => a.date < b.date ? -1 : 1)) rows.push([e.date, '', 'Qarz', e.amount, e.currency, '', '', '', e.sub, '', e.title]);
  return '﻿' + rows.map(r => r.map(calc.csvEscape).join(',')).join('\r\n');
}

async function doImport(text) {
  let o;
  try { o = JSON.parse(text); } catch (e) { importError('JSON notoʻgʻri — faylni tekshiring'); return; }
  if (!validBackup(o)) { importError('Bu Xarajat zaxirasi emas'); return; }
  const accs = o.settings.accounts.filter(a => a && typeof a === 'object' && typeof a.id === 'string' && a.name);
  if (!accs.length) { importError('Zaxirada birorta hisob yoʻq — bu faylni tiklab boʻlmaydi. Hozirgi maʼlumotlar oʻzgarmadi.'); return; }
  const ok = await confirmDlg({ title: 'Maʼlumotlarni almashtiramizmi?', text: 'Hozirgi hisoblar, yozuvlar, qarzlar va kreditlar zaxiradagisi bilan almashtiriladi.', ok: 'Tiklash', danger: true });
  if (!ok) return;
  const oldIds = new Set([...localDocIds(), ...Object.keys(Sync.remote)]);
  S = emptyState();
  S.settings = Object.assign(defaultSettings(), o.settings, { onboarded: true });
  if (o.debts) S.debts = o.debts;
  if (o.loans) S.loans = o.loans;
  S.months = {};
  for (const ym in o.months) if (/^\d{4}-\d{2}$/.test(ym) && o.months[ym] && Array.isArray(o.months[ym].tx)) S.months[ym] = o.months[ym];
  normalizeState();
  const ids = localDocIds();
  for (const id of oldIds) if (!ids.includes(id)) Sync.queue(id); // deletes stale docs remotely
  commit(ids);
  closeAllLayers();
  location.hash = '#asosiy';
  toast('Zaxira tiklandi');
}

  lfSave: (el, L) => {
    const c = L.ctx, id = newId('l');
    const payDay = Math.min(31, Math.max(1, parseNum(c.payDay) || parseD(c.issued || today()).getDate()));
    const term = parseNum(c.term);
    let loan;
    if (c.type === 'card') {
      const limit = parseNum(c.limit);
      if (!limit) { warn('Limitni kiriting'); return; }
      loan = { id, type: 'card', name: c.name.trim() || 'Kredit karta', lender: c.lender.trim(), limit, used: parseNum(c.used), minPct: parseFloatUz(c.minPct) || 10, grace: parseNum(c.grace), rate: parseFloatUz(c.cardRate), payDay, status: 'active', createdAt: Date.now() };
    } else {
      if (!term || term > 600) { warn('Muddatni oylarda kiriting'); return; }
      const issued = c.issued || today();
      if (c.type === 'bank') {
        const P = parseNum(c.principal), r = parseFloatUz(c.rate);
        if (!P) { warn('Kredit summasini kiriting'); return; }
        if (r < 0 || r > 200) { warn('Foizni tekshiring'); return; }
        loan = { id, type: 'bank', scheme: c.scheme, name: c.name.trim() || 'Bank krediti', lender: c.lender.trim(), principal: P, rate: r, term, issued, payDay, firstDue: addMonths(issued, 1, payDay), status: 'active', createdAt: Date.now() };
      } else {
        const T = parseNum(c.total), P = parseNum(c.principal);
        if (!T) { warn('Ustama bilan jami narxni kiriting'); return; }
        if (P > T) { warn('Tovar narxi jami narxdan katta'); return; }
        loan = { id, type: 'installment', scheme: 'flat', name: c.name.trim() || 'Nasiya', lender: c.lender.trim(), principal: P || T, total: T, rate: 0, term, issued, payDay, firstDue: addMonths(issued, 1, payDay), status: 'active', createdAt: Date.now() };
      }
    }
    addLoan(loan, Math.min(parseNum(c.prepaid), term || 0));
    L.close();
    location.hash = '#kredit-' + id;
    toast('Kredit qoʻshildi');
  },
